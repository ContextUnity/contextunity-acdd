<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}" />
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var forced = params.get("theme");
        var saved = localStorage.getItem("acdd-theme");
        var theme = (forced === "light" || forced === "dark")
          ? forced
          : ((saved === "light" || saved === "dark")
            ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
        document.documentElement.setAttribute("data-theme", theme);
        window.__syncHighlightTheme = function (t) {
          var hlL = document.getElementById("hlLight");
          var hlD = document.getElementById("hlDark");
          if (hlL) hlL.disabled = (t !== "light");
          if (hlD) hlD.disabled = (t === "light");
        };
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />
  <link id="hlLight" rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}" />
  <link id="hlDark" rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" />
  <script>
    if (window.__syncHighlightTheme) {
      window.__syncHighlightTheme(document.documentElement.getAttribute("data-theme") || "dark");
    }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="{{ get_url(path='/') }}">
        <img src="{{ get_url(path='favicon.svg') }}" alt="ACDD" width="26" height="26" />
        <span class="brand-name">ContextUnity ACDD</span>
        <span class="brand-tag">v{{ config.extra.version }}</span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="{{ get_url(path='/') }}#state">State</a>
        <a href="{{ get_url(path='/') }}#code-index">Index</a>
        <a href="{{ get_url(path='/') }}#linter">Lint</a>
        <a href="{{ get_url(path='/') }}#workflows">Workflows</a>
        <a href="{{ get_url(path='/') }}#coming-soon">Roadmap</a>
      </nav>

      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm {% if current_path is defined and '/docs/' in current_path %}is-active{% endif %}" href="{{ get_url(path='@/docs/_index.md') }}">Docs</a>
        <a class="btn btn-ghost btn-sm hide-xs" href="{{ config.extra.github_url }}" target="_blank" rel="noopener">GitHub</a>
        <a class="btn btn-primary btn-sm" href="{{ get_url(path='@/docs/getting-started/quickstart.md') }}">Quickstart</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-meta">ContextUnity ACDD · Pure Rust MCP &amp; CLI · MIT License</div>
      <div class="footer-links">
        <a href="{{ get_url(path='@/docs/state/_index.md') }}">State</a>
        <a href="{{ get_url(path='@/docs/index/_index.md') }}">Index</a>
        <a href="{{ get_url(path='@/docs/lint/_index.md') }}">Lint</a>
        <a href="{{ get_url(path='@/docs/workflows/_index.md') }}">Workflows</a>
        <a href="mailto:acdd@contextunity.com">acdd@contextunity.com</a>
        <a href="{{ config.extra.github_url }}" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById("mobileMenuBtn");
    const navLinks = document.getElementById("navLinks");
    if (menuBtn && navLinks) {
      menuBtn.addEventListener("click", () => {
        const open = navLinks.classList.toggle("open");
        menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    }

    const themeToggle = document.getElementById("themeToggle");
    if (themeToggle) {
      const syncThemeBtn = (theme) => {
        themeToggle.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
        themeToggle.title = theme === "light" ? "Switch to dark theme" : "Switch to light theme";
        if (window.__syncHighlightTheme) {
          window.__syncHighlightTheme(theme);
        }
      };
      syncThemeBtn(document.documentElement.getAttribute("data-theme") || "dark");
      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = current === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        try {
          localStorage.setItem("acdd-theme", next);
        } catch (e) {}
        syncThemeBtn(next);
      });
    }

    document.querySelectorAll("[data-copy-target]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const el = document.getElementById(btn.dataset.copyTarget);
        if (!el) return;
        const text = el.dataset.rawCmd || el.textContent.replace(/^\$\s*/, "").trim();
        await navigator.clipboard.writeText(text);
        const orig = btn.textContent;
        btn.textContent = "Copied";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove("copied");
        }, 1600);
      });
    });

    // Sync channel switches across hero & bottom install widgets
    document.querySelectorAll("[data-channel-name]").forEach((tab) => {
      tab.addEventListener("click", () => {
        const channel = tab.dataset.channelName;
        const cmd = tab.dataset.channelCmd;
        document.querySelectorAll("[data-channel-name]").forEach((t) => {
          const match = t.dataset.channelName === channel;
          t.classList.toggle("active", match);
          t.setAttribute("aria-pressed", match ? "true" : "false");
        });
        document.querySelectorAll("[data-install-cmd]").forEach((codeEl) => {
          codeEl.dataset.rawCmd = cmd;
          codeEl.innerHTML = '<span class="prompt-sign">$</span>' + cmd;
        });
      });
    });

    document.querySelectorAll("[data-gate-tab]").forEach((tab) => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.gateTab;
        document.querySelectorAll("[data-gate-tab]").forEach((t) => {
          const active = t === tab;
          t.classList.toggle("active", active);
          t.setAttribute("aria-selected", active ? "true" : "false");
        });
        document.querySelectorAll("[data-gate-panel]").forEach((p) => {
          p.classList.toggle("active", p.dataset.gatePanel === target);
        });
      });
    });

    document.querySelectorAll("[data-code-tabs]").forEach((box) => {
      const tabs = box.querySelectorAll("[data-code-tab]");
      const panels = box.querySelectorAll("[data-code-panel]");
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const target = tab.dataset.codeTab;
          tabs.forEach((t) => {
            const active = t === tab;
            t.classList.toggle("active", active);
            t.setAttribute("aria-selected", active ? "true" : "false");
          });
          panels.forEach((p) => {
            p.classList.toggle("active", p.dataset.codePanel === target);
          });
        });
      });
    });

    const filterInput = document.getElementById("sidebarFilter");
    if (filterInput) {
      filterInput.addEventListener("input", () => {
        const q = filterInput.value.trim().toLowerCase();
        document.querySelectorAll(".sidebar-group").forEach((group) => {
          let visibleCount = 0;
          group.querySelectorAll(".sidebar-list > li").forEach((li) => {
            const topLink = li.querySelector(":scope > a");
            const label = topLink ? topLink.textContent : li.textContent;
            const match = label.toLowerCase().includes(q);
            li.style.display = match ? "" : "none";
            if (match) visibleCount += 1;
          });
          group.style.display = (!q || visibleCount > 0) ? "" : "none";
        });
      });
    }

    document.querySelectorAll(".prose table").forEach((table) => {
      if (table.parentElement && table.parentElement.classList.contains("table-scroll")) return;
      const wrapper = document.createElement("div");
      wrapper.className = "table-scroll";
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    });
  </script>
</body>
</html>
