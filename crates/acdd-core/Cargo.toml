[package]
name = "acdd-core"
version = "0.6.2"
edition = "2021"
authors = ["Oleksii Pylypchuk <oleksii.pylypchuk@tuta.com>"]
description = "Pure Rust ContextUnity ACDD core contracts, IDs, errors, path policies, configuration, and filesystem confinement"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
schemars = "1.0"
libc = "0.2"

[features]
failpoints = []
