version: 2
inherit: base

tags:
  - default
  - docs

default_tools:
  - code_map_overview
  - code_map_search
  - code_map_inspect
  - code_map_impact
  - code_map_analyze
  - code_map_explain
  - code_map_tests
  - code_map_prove_removal
  - code_map_query
  - ast_grep_search
  - get_doc
  - search_docs
  - acdd_read
  - acdd_guide
  - acdd_state
  - acdd_claim
  - acdd_verify
  - acdd_submit
  - acdd_blackboard

proofs:
  blueprint:
    description: "Architectural blueprint with grounded citations and per-task slices"
    schema:
      type: object
      required:
        - cited_invariants
        - cited_symbols
        - global_negative_boundaries
        - blackboard_decision_id
        - tasks
      properties:
        ac_mapping:
          type: array
          items:
            type: string
        c2_boundary_impact:
          type: string
        adr_required:
          type: boolean
        sad_updates:
          type: array
          items:
            type: string
        cited_invariants:
          type: array
          items:
            type: string
        cited_symbols:
          type: array
          items:
            type: string
        global_negative_boundaries:
          type: array
          items:
            type: string
        blackboard_decision_id:
          type: string
        tasks:
          type: object
          additionalProperties:
            type: object
            required:
              - layer
              - summary
              - exported_interfaces
              - negative_boundaries
              - incoming_seams
              - outgoing_seams
            properties:
              layer:
                type: string
              summary:
                type: string
              exported_interfaces:
                type: array
                items:
                  type: string
              negative_boundaries:
                type: array
                items:
                  type: string
              canonical_owners:
                type: array
                items:
                  type: string
              mechanism_rules:
                type: array
                items:
                  type: string
              max_net_loc:
                type: integer
              verification_seam:
                type: string
              incoming_seams:
                type: array
                items:
                  type: object
                  required:
                    - source_task
                    - contract_type
                    - contract_ref
                    - specification
                  properties:
                    source_task:
                      type: string
                    contract_type:
                      type: string
                      enum:
                        - seam_dependency
                        - shared_type
                        - shared_helper
                    contract_ref:
                      type: string
                    specification:
                      type: string
              outgoing_seams:
                type: array
                items:
                  type: object
                  required:
                    - target_task
                    - contract_type
                    - contract_ref
                    - specification
                  properties:
                    target_task:
                      type: string
                    contract_type:
                      type: string
                      enum:
                        - seam_dependency
                        - shared_type
                        - shared_helper
                    contract_ref:
                      type: string
                    specification:
                      type: string

roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    guidance: "Lead minimal, grounded architectural synthesis using ACDD MCP navigation (acdd_read, code_map_search, code_map_impact, search_docs) before proposing changes."
  builder:
    mode: subagent
    reuse_on_reject: true
    guidance: "Implement the accepted slice with minimal complexity inside admitted scope using ACDD MCP navigation, keeping verification proportional to risk."
  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    guidance: "Review declared contours independently; verify blast radius with code_map_impact and run code_map_query(operation: \"duplicates\", path: <scope>) and code_map_query(operation: \"dead_tails\", path: <scope>) (workspace-wide without path on integration_review), rejecting new clones, phantom_tested dead code, dead_tails, or dangling_calls with structured findings."

guidance:
  code.principles:
    description: "CODE ENGINEERING & SIMPLICITY PRINCIPLES"
    criteria:
      - "Prefer simpler, maintainable solutions and canonical owner reuse (INV-SINGLE-OWNER) over accumulating defensive abstractions, shadow resolvers, or narrow string heuristics."
      - "Model domain states and variants with strong language-native types (closed enums/sum types, value objects/classes, typed interfaces/traits, and inheritance/polymorphism where appropriate) and one Single Source of Truth (SSOT) instead of parallel magic strings, boolean flag bags, or duplicated copy-pasted logic."
      - "Extract shared helpers, base types, or dispatch tables whenever two or more consumers share logic (`>= 5` lines or repeated pipelines), while keeping single-caller pipelines cohesive without gratuitous boilerplate."
      - "Zero production N+1 I/O, DB, parse, or subprocess loops: preload or batch lookups once at the operation boundary (bulk queries, pre-indexed maps, batched object reads) and pass borrowed views into resolvers rather than querying storage, parsing whole files, or spawning child processes per item/edge."
      - "Trust already-validated internal artifacts within the same request instead of re-checking them, and skip computing or resolving data branches discarded by the caller's active filters."
      - "Validate untrusted inputs once at external boundaries and trust validated internal types/schemas/locks without duplicating checks."
      - "Never convert one-time incidents into permanent architectural layers or fence lists; fix the owning mechanism instead."
      - "Eliminate redundant validations and dead code in touched files; keep tests proportional to actual operational risk."
      - "Escalate via acdd_blackboard (topic: decisions or blockers) before introducing any new subsystem or exceeding max_net_loc (`BUDGET_OVERRIDE: <reason>`). Reviewers must verify any approved BUDGET_OVERRIDE reason against the measured net production LOC delta before accepting an overage."
      - "Do NOT invent unrequested architecture, fallback layers, modes, or parallel pipelines outside the accepted spec and pre_task_slice; any contract or scope expansion requires an approved decision in acdd_blackboard (topic: decisions)."
      - "Keep cohesive pipelines in one module; extract a separate file/submodule only for an independent domain or shared multi-consumer component rather than splitting tight internal state into pub(super) import boilerplate."
      - "Reuse existing test harnesses when available and enforce strict test runtime budgets: execute pure logic, parser, graph, and state tests in-memory with shared setup hoisted outside loops; reserve disk tempdirs, VCS checkouts, and child processes strictly for genuine isolation contracts."
  code.tools:
    description: "MANDATORY ACDD GRAPH & SOURCE NAVIGATION PROTOCOL"
    criteria:
      - "Use acdd_read(selector: \"SymbolName\", path: ...) for complete symbol reads, code_map_overview / code_map_search(detail: \"compact\") / ast_grep_search for discovery, and rg strictly for literals/config/error text."
      - "Run code_map_impact, code_map_tests, code_map_prove_removal, search_docs, and get_doc before editing or deleting declarations to reconcile ADRs and INV-* owners."
      - "Before submitting build, polish, or review (or workspace-wide on integration_review), run code_map_query(operation: \"duplicates\") and code_map_query(operation: \"dead_tails\") and eliminate or reject clones, phantom_tested dead code, dead_tails, and dangling_calls."
      - "If ACDD MCP tools are unavailable in the current harness/runtime, use the equivalent `acdd` CLI commands (`acdd claim`, `verify`, `submit`, `blackboard`, `read`, `query`, `context`, `doc`) following `skills/acdd/SKILL.md`."
  milestone.synthesis:
    description: "ARCHITECTURAL BLUEPRINT SYNTHESIS"
    criteria:
      - "Audit existing canonical owners and extension seams before decomposing tasks; assign minimal layers, exported interfaces, negative boundaries, cross-task seams, mechanism_rules, and realistic max_net_loc in proof.tasks."
      - "Record the architectural decision via acdd_blackboard and cite its ID in blackboard_decision_id."
  milestone.blueprint_review:
    description: "INDEPENDENT BLUEPRINT REVIEW"
    criteria:
      - "Verify cited invariants, canonical-owner reuse, layer boundaries, and cross-task seams across proof.tasks."
      - "Confirm every slice defines canonical_owners, mechanism_rules, realistic max_net_loc, proportional verification, and a valid blackboard_decision_id."
  task.code:
    description: "TASK IMPLEMENTATION & SEAM VERIFICATION"
    criteria:
      - "Follow proof.tasks[task_ref] (`canonical_owners`, `mechanism_rules`, `max_net_loc`), author seam checks directly in build, and verify exit_code == 0."
      - "If context_reset_required is set after rearchitect, read the latest rearchitect decision from acdd_blackboard (topic: decisions) and rebuild cleanly from scratch."
      - "Keep functions cohesive; consider decomposing long production functions (>150 LOC) when they mix unrelated responsibilities or obscure control flow, while keeping linear pipelines, tables, or dispatchers intact when splitting adds indirection without clarity; extract repeated logic (>=5 lines) and multi-consumer behavior into shared helpers, classes, enums, or typed interfaces."
      - "Fix defects across the full pattern class via the canonical owner (check sibling call sites with code_map_search/ast_grep_search) rather than patching one line at a time."
      - "Avoid N+1 I/O, DB queries, repeated parses, unbatched subprocess spawns, and quadratic fallback scans in production loops; preload shared snapshots at the command boundary and verify hot-path latency/resource usage proportionally."
      - "Keep tests fast and within runtime budget: test pure logic and state matrices in-memory without disk or VCS I/O, consolidate variants into data-driven table matrices sharing one base setup outside the loop (avoid sequential multi-setup mega-tests inside one test), reuse existing in-process test harnesses, eliminate redundant VCS/subprocess queries in callers, and profile slow tests before submitting."
  task.review:
    description: "INDEPENDENT TASK IMPLEMENTATION REVIEW"
    criteria:
      - "Verify task contract satisfaction, concurrency safety, and code/graph hygiene across the declared contours."
      - "Use rejection kind: defect (fail: build) for localized bugs, or kind: architectural_drift (fail_drift: rearchitect) for structural violations requiring builder context reset."
      - "Complete all contours before rejecting (`NO EARLY-ABORT`) and sweep sibling call sites (`DEFECT-CLASS SWEEP`) so related defects are closed in one round."
      - "Check long functions (>150 LOC) for genuine entanglement or poor readability and recommend decomposition only when warranted (do not reject cohesive linear/declarative/dispatch functions purely for line count); reject repeated logic (>=5 lines), stringly-typed or duplicated variant branching where enums/SSOT helpers belong, orphan helpers, unapproved net LOC overages (verifying that approved BUDGET_OVERRIDE reasons cover the measured delta), and imperative non-tabular mega-tests."
      - "Reject production N+1 I/O, DB, full-parse, or subprocess loops, quadratic O(N*M) fallback scans, redundant re-verification of trusted internal artifacts, and wasted computation for filtered-out outputs."
      - "Audit tests for runtime budget compliance, full coverage parity, and anti-bloat: reject slow tests caused by repeated VCS/subprocess spawns, per-case tempdir/worktree rebuilds, unhoisted fixtures, or disk-backed testing of pure in-memory logic; reject missing assertions or weakened coverage during refactors, verify zero fixture masking, and enforce harness reuse and data-driven table matrices."
  task.rearchitect:
    description: "ARCHITECTURAL RECOVERY AFTER DRIFT"
    criteria:
      - "Diagnose the structural cause behind architectural_drift against cited invariants and canonical owners."
      - "Record the simplest seam correction on acdd_blackboard (topic: decisions) before routing a fresh builder context to build."
  milestone.polish:
    description: "INTEGRATION POLISH & DOCS RECONCILIATION"
    criteria:
      - "Resolve integration or review findings strictly inside admitted polish paths without weakening verified contracts."
  milestone.review:
    description: "INTEGRATION REVIEW"
    criteria:
      - "Review the integrated diff against target base across all declared contours, verify trace freshness, and reject only concrete contract defects or workspace hygiene regressions."
      - "Verify touched test suites respect runtime budgets, leave zero leaked temp resources, and pass workspace-wide clone/dead-tail hygiene."
  milestone.handoff:
    description: "TERMINAL DELIVERY RECEIPT"
    criteria:
      - "Confirm every non-cancelled task is completed and all required predecessor proofs match the current tree."

contours:
  architecture:
    description: "Verify single-owner reuse, simplicity, layer boundaries, and absence of redundant or incident-driven abstractions."
    criteria:
      - "Confirm canonical owners and existing safeguards are reused instead of accumulating defensive wrappers, redundant validations, parallel pipelines, or shadow resolvers."
      - "Verify strict layer boundaries, zero unnecessary code or narrow string heuristics where structural data exists, proportional complexity, and zero incident-driven permanent abstractions."
  concurrency:
    description: "Verify concurrent operations preserve revision fencing, claim ownership, and rollback integrity."
    criteria:
      - "Verify CAS preconditions, claim revisions, and lock ordering prevent partial or stale state publication."
  project_isolation:
    description: "Verify data, profiles, paths, and Git operations stay confined to the owning workspace."
    criteria:
      - "Confirm path confinement, symlink rejection, and workspace isolation."

commands:
  build_check:
    unbound: true
  verify_all:
    unbound: true

gates:
  - id: blueprint_synthesis
    gates:
      - id: synthesize
        role: architect
        proof: blueprint
        guidance:
          - milestone.synthesis
          - core.execution
          - code.principles
          - code.tools
          - hitl.pro
        context:
          - docs.instructions
          - docs.adrs
          - docs.invariants
        pass: review
      - id: review
        role: independent_reviewer
        proof: review
        contours:
          - claims
          - architecture
          - project_isolation
          - administration
        independent_from:
          - synthesize
        guidance:
          - milestone.blueprint_review
          - core.review
          - code.principles
          - code.tools
          - hitl.pro
        context:
          - docs.instructions
          - docs.adrs
          - docs.invariants
        save:
          immutable: true
        fail: synthesize

  - tasks:
      gates:
        - id: build
          role: builder
          save: snapshot
          command: build_check
          proof: command
          checks:
            - code.seam
          guidance:
            - task.code
            - core.execution
            - code.principles
            - code.tools
            - hitl.pro
          context:
            - docs.instructions
            - docs.adrs
            - docs.invariants
            - code.symbols
            - code.tests
            - code.external_callers
          pass: review

        - id: review
          role: independent_reviewer
          proof: review
          contours:
            - paths
            - claims
            - architecture
            - concurrency
            - project_isolation
            - administration
          independent_from:
            - build
          need:
            - build
          guidance:
            - task.review
            - core.review
            - code.principles
            - code.tools
            - hitl.pro
          context:
            - docs.instructions
            - docs.adrs
            - docs.invariants
            - code.symbols
            - code.tests
            - code.external_callers
          save:
            immutable: true
          pass: deliver
          fail: build
          fail_drift: rearchitect

        - id: deliver
          role: independent_reviewer
          independent_from:
            - build
          need:
            - build
            - review
          receipt: true
          guidance:
            - hitl.pro
          save:
            immutable: true
            post: commit
          fail: build

        - id: rearchitect
          role: architect
          guidance:
            - task.rearchitect
            - core.execution
            - code.principles
            - code.tools
            - hitl.pro
          context:
            - docs.instructions
            - docs.adrs
            - docs.invariants
            - code.symbols
          pass: build
          max_attempts: 3

  - id: verify
    command: verify_all
    proof: command
    max_attempts: 3
    pass: integration_review
    fail: polish

  - id: polish
    role: builder
    scope:
      - ".acdd/profile.yaml"
      - ".acdd/profiles/**"
      - "docs/**"
      - "skills/**"
      - "AGENTS.md"
      - "README.md"
      - ".gitignore"
    command: verify_all
    proof: command
    max_attempts: 3
    guidance:
      - milestone.polish
      - core.execution
      - code.principles
      - code.tools
      - hitl.pro
    context:
      - docs.instructions
      - docs.adrs
      - docs.invariants
    pass: verify

  - id: integration_review
    role: independent_reviewer
    proof: review
    contours:
      - paths
      - claims
      - architecture
      - concurrency
      - project_isolation
      - administration
    independent_from:
      - polish
      - "tasks.build"
    need:
      - verify
    guidance:
      - milestone.review
      - core.review
      - code.principles
      - code.tools
      - hitl.pro
    context:
      - docs.instructions
      - docs.adrs
      - docs.invariants
      - code.symbols
      - code.tests
      - code.external_callers
    save:
      immutable: true
    pass: handoff
    fail: polish

  - id: handoff
    role: independent_reviewer
    independent_from:
      - polish
      - "tasks.build"
    need:
      - verify
      - integration_review
    receipt: true
    guidance:
      - milestone.handoff
      - hitl.pro
    save:
      immutable: true
      post: commit
      archive: true
      prune: true
    fail: polish
