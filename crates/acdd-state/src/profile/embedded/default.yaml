version: 2

git:
  isolation: worktree
  worktrees: manual
  commit_mode: plumbing
  integrate: manual

save: commit

tags:
  - default

protected_paths: []

default_tools:
  - acdd_read
  - acdd_guide
  - acdd_state
  - acdd_claim
  - acdd_verify
  - acdd_submit
  - acdd_blackboard

limits:
  max_guidance_bytes: 32768
  max_log_bytes: 1048576
  max_capture_bytes: 262144
  max_line_bytes: 65536
  diagnostic_inline_bytes: 4096
  max_metadata_bytes: 2048
  max_trace_summary_bytes: 2048
  max_command_timeout_seconds: 1800

git_commit_notes:
  default:
    ref_name: refs/notes/acdd
    max_bytes: 2048
    format: markdown
    sections:
      - duration
      - tasks_summary
      - review_cycles
      - diff_breakdown
      - test_suite
      - topology

proofs:
  blueprint:
    description: "Architectural blueprint with grounded citations and per-task slices"
    schema:
      type: object
      required:
        - cited_invariants
        - cited_symbols
        - global_negative_boundaries
        - blackboard_decision_id
        - tasks
      properties:
        ac_mapping:
          type: array
          items:
            type: string
        c2_boundary_impact:
          type: string
        adr_required:
          type: boolean
        sad_updates:
          type: array
          items:
            type: string
        cited_invariants:
          type: array
          items:
            type: string
        cited_symbols:
          type: array
          items:
            type: string
        global_negative_boundaries:
          type: array
          items:
            type: string
        blackboard_decision_id:
          type: string
        tasks:
          type: object
          additionalProperties:
            type: object
            required:
              - layer
              - summary
              - exported_interfaces
              - negative_boundaries
              - incoming_seams
              - outgoing_seams
            properties:
              layer:
                type: string
              summary:
                type: string
              exported_interfaces:
                type: array
                items:
                  type: string
              negative_boundaries:
                type: array
                items:
                  type: string
              verification_seam:
                type: string
              incoming_seams:
                type: array
                items:
                  type: object
                  required:
                    - source_task
                    - contract_type
                    - contract_ref
                    - specification
                  properties:
                    source_task:
                      type: string
                    contract_type:
                      type: string
                      enum:
                        - seam_dependency
                        - shared_type
                        - shared_helper
                    contract_ref:
                      type: string
                    specification:
                      type: string
              outgoing_seams:
                type: array
                items:
                  type: object
                  required:
                    - target_task
                    - contract_type
                    - contract_ref
                    - specification
                  properties:
                    target_task:
                      type: string
                    contract_type:
                      type: string
                      enum:
                        - seam_dependency
                        - shared_type
                        - shared_helper
                    contract_ref:
                      type: string
                    specification:
                      type: string

roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    guidance: "Lead architectural synthesis, ground decisions in repository invariants and extension seams, record the decision on acdd_blackboard, and define per-task slices before task execution."
  contract_author:
    mode: subagent
    reuse_on_reject: true
    guidance: "Author the executable contract and runtime-red proof inside the admitted scope without touching protected paths."
  builder:
    mode: subagent
    reuse_on_reject: true
    guidance: "Implement the accepted contract inside the admitted write scope and verify all gate checks."
  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    guidance: "Conduct an independent architectural and verification review across the declared contours; reject defects with structured findings."

guidance:
  milestone.synthesis:
    description: "MANDATORY GROUNDED ARCHITECTURAL BLUEPRINT SYNTHESIS"
    criteria:
      - "Inspect relevant repository artifacts, invariants, and extension seams before decomposing tasks."
      - "Assign each task to its minimal layer, define exported interfaces, negative boundaries, and cross-task seams."
      - "Record the architectural decision via acdd_blackboard and reference its identifier in the blueprint proof."
  milestone.blueprint_review:
    description: "INDEPENDENT REVIEW OF THE ARCHITECTURAL BLUEPRINT"
    criteria:
      - "Verify cited invariants, boundaries, and cross-task seam consistency."
      - "Confirm every task has complete slice definitions and a recorded blackboard decision identifier."
  milestone.polish:
    description: "Resolve integration failures or reviewer findings within the admitted polish scope."
    criteria:
      - "Keep edits confined to admitted polish paths and preserve verified task contracts."
  milestone.review:
    description: "RUN INTEGRATION REVIEW & BOUNDED VERIFICATION"
    criteria:
      - "Review the integrated diff against target base for cohesion, scope compliance, and zero regressions."
      - "Evaluate declared contours with engineering judgment and verify all required traces are fresh."
  milestone.handoff:
    description: "Terminal run delivery, capturing closure summary, receipts, and archiving completed spec."
    criteria:
      - "Confirm every non-cancelled task is completed and all required predecessor proofs match the current tree."
  task.contract:
    description: "SEAM CONTRACT AUTHORING & RUNTIME-RED PROOF"
    criteria:
      - "Author a failing runtime-assertion contract test within the admitted scope before implementation."
      - "Parameterize homogeneous boundary cases into table-driven loops and avoid duplicate setup."
  task.contract_review:
    description: "INDEPENDENT CONTRACT AUDIT"
    criteria:
      - "Verify the contract reaches live production paths, includes negative boundaries, and fails cleanly at runtime."
  task.code:
    description: "MINIMAL DURABLE IMPLEMENTATION"
    criteria:
      - "Implement the accepted contract with minimal complexity inside the admitted scope and verify passing tests."
  task.review:
    description: "INDEPENDENT IMPLEMENTATION REVIEW"
    criteria:
      - "Verify contract satisfaction, scope boundaries, concurrency safety, and root-cause remediation without test bloat."
  hitl.pro: "HITL level PRO: allow internal helpers and non-breaking implementation changes; escalate public APIs, CLI/MCP surfaces, storage schemas, and cross-milestone contracts."

contours:
  paths:
    description: "Verify changes stay within the admitted write scope and preserve protected paths."
    criteria:
      - "Compare changed, staged, and untracked files against admitted scope and protected_paths."
      - "Confirm each modified path contributes directly to the accepted task or polish contract."
  claims:
    description: "Verify every accepted contract claim is implemented and supported by fresh evidence."
    criteria:
      - "Trace each invariant and acceptance criterion to live production code and fresh verification traces."
      - "Verify malformed or missing inputs fail closed with exact diagnostics."
  concurrency:
    description: "Verify concurrent operations preserve revision fencing, claim ownership, and rollback integrity."
    criteria:
      - "Verify CAS preconditions, claim revisions, and lock ordering prevent partial or stale state publication."
  project_isolation:
    description: "Verify data, profiles, paths, and Git operations stay confined to the owning workspace."
    criteria:
      - "Confirm path confinement, symlink rejection, and workspace isolation."
  administration:
    description: "Verify protected configuration, profile pins, receipts, and privileged delivery remain governed."
    criteria:
      - "Verify schema integrity, commit tree parity, and durable receipt generation."

commands:
  test:
    unbound: true
  build_check:
    unbound: true
  verify_all:
    unbound: true

gates:
  - id: blueprint_synthesis
    gates:
      - id: synthesize
        role: architect
        proof: blueprint
        guidance:
          - milestone.synthesis
          - hitl.pro
        pass: review
      - id: review
        role: independent_reviewer
        proof: review
        contours:
          - claims
          - project_isolation
          - administration
        independent_from:
          - synthesize
        guidance:
          - milestone.blueprint_review
          - hitl.pro
        save:
          immutable: true
        fail: synthesize

  - tasks:
      gates:
        - id: contract
          role: contract_author
          command: test
          proof: contract
          expected_failure:
            exit_codes: [1, 101, 134]
          guidance:
            - task.contract
            - hitl.pro
          save:
            post: snapshot
          pass: contract_review

        - id: contract_review
          role: independent_reviewer
          proof: review
          contours:
            - paths
            - claims
          independent_from:
            - contract
          need:
            - contract
          guidance:
            - task.contract_review
            - hitl.pro
          save:
            immutable: true
          pass: build
          fail: contract

        - id: build
          role: builder
          command: build_check
          proof: command
          guidance:
            - task.code
            - hitl.pro
          save:
            post: snapshot
          pass: review

        - id: review
          role: independent_reviewer
          proof: review
          contours:
            - paths
            - claims
            - concurrency
            - project_isolation
            - administration
          independent_from:
            - build
          need:
            - build
          guidance:
            - task.review
            - hitl.pro
          save:
            immutable: true
          pass: deliver
          fail: build

        - id: deliver
          role: independent_reviewer
          independent_from:
            - build
          need:
            - build
            - review
          receipt: true
          guidance:
            - hitl.pro
          save:
            immutable: true
            post: commit
            git_commit_note: default
          fail: build

  - id: verify
    command: verify_all
    proof: command
    max_attempts: 3
    pass: integration_review
    fail: polish

  - id: polish
    role: builder
    scope:
      - ".acdd/profile.yaml"
      - ".acdd/profiles/**"
      - ".acdd/frameworks/**"
      - "docs/**"
      - "skills/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "README.md"
      - ".gitignore"
    command: verify_all
    proof: command
    max_attempts: 3
    guidance:
      - milestone.polish
      - hitl.pro
    pass: verify

  - id: integration_review
    role: independent_reviewer
    proof: review
    contours:
      - paths
      - claims
      - concurrency
      - project_isolation
      - administration
    independent_from:
      - polish
      - "tasks.build"
    need:
      - verify
    guidance:
      - milestone.review
      - hitl.pro
    save:
      immutable: true
    pass: handoff
    fail: polish

  - id: handoff
    role: independent_reviewer
    independent_from:
      - polish
      - "tasks.build"
    need:
      - verify
      - integration_review
    receipt: true
    guidance:
      - milestone.handoff
      - hitl.pro
    save:
      immutable: true
      post: commit
      archive: true
      prune: true
      git_commit_note: default
    fail: polish
