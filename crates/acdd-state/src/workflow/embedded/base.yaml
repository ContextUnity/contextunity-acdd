version: 2

git:
  isolation: worktree
  worktrees: manual

save: commit

tags:
  - default

protected_paths: []

default_tools:
  - acdd_read
  - acdd_guide
  - acdd_state
  - acdd_claim
  - acdd_verify
  - acdd_submit
  - acdd_blackboard

paths:
  docs:
    - "docs/**"
    - "AGENTS.md"
    - "README.md"
  adrs:
    - "docs/adr/**"
  instructions:
    - "**/AGENTS.md"
    - "TESTS.md"

limits:
  max_guidance_bytes: 32768
  max_log_bytes: 1048576
  max_capture_bytes: 262144
  max_line_bytes: 65536
  diagnostic_inline_bytes: 4096
  max_metadata_bytes: 2048
  max_trace_summary_bytes: 2048
  max_command_timeout_seconds: 1800

guidance:
  core.execution:
    description: "EXECUTION & COMPLETION"
    criteria:
      - "Stay inside `admitted_scope`, satisfy every declared `acceptance_criteria`, keep verification proportional to risk, and submit once green without out-of-scope churn."
      - "REBUTTAL OVER BLIND REWRITE: If a review finding contradicts an accepted spec, decision, or verified check, post an evidence-backed rebuttal on `acdd_blackboard` (`topic: decisions`) with citations rather than weakening the contract."
  core.review:
    description: "INDEPENDENT EVIDENCE-BASED REVIEW"
    criteria:
      - "NO EARLY-ABORT: Audit every declared contour and changed file so all findings for the round are reported in one pass."
      - "DEFECT-CLASS SWEEP: On finding any bug pattern, search every sibling call site and report all affected locations together."
      - "BURDEN OF PROOF: Reject only on concrete contract/invariant violations or reproducible defects (weighing blackboard rebuttals objectively); log optional ideas in `acdd_blackboard` (`topic: deferred`) and pass."
  hitl.pro: "HITL PRO: internal changes within `admitted_scope` are autonomous; escalate public interfaces, schemas, or cross-run contract changes via `acdd_blackboard` (`decisions` or `blockers`)."

contours:
  paths:
    description: "Verify changes stay within the admitted write scope and preserve protected paths."
    criteria:
      - "Compare changed, staged, and untracked files against admitted scope and protected_paths."
      - "Confirm each modified path contributes directly to the accepted task or polish contract."
  claims:
    description: "Verify every accepted contract claim is implemented and supported by risk-proportional evidence."
    criteria:
      - "Trace each invariant and acceptance criterion to live evidence and verification proportional to actual operational risk."
      - "Enforce fail-closed diagnostics at untrusted external boundaries while trusting existing validated internal safeguards without duplicate checks."
  administration:
    description: "Verify protected configuration, profile pins, receipts, and privileged delivery remain governed."
    criteria:
      - "Verify schema integrity, commit tree parity, and durable receipt generation."

gates: []
