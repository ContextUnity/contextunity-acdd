[package]
name = "acdd-state"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Domain-agnostic profile, workflow graph, and SQLite state engine for ACDD"
license.workspace = true

[dependencies]
acdd-core = { workspace = true }
acdd-spec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
schemars = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
acdd-state = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }

[features]
failpoints = ["acdd-core/failpoints"]
test-support = []
