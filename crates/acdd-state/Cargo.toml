[package]
name = "acdd-state"
version = "0.7.0"
edition = "2021"
authors = ["Oleksii Pylypchuk <oleksii.pylypchuk@tuta.com>"]
description = "Domain-agnostic profile, workflow graph, and SQLite state engine for ACDD"
license = "MIT"

[dependencies]
acdd-core = { path = "../acdd-core" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "hooks", "limits", "backup"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
anyhow = "1.0"
schemars = "1.0"
libc = "0.2"

[dev-dependencies]
acdd-state = { path = ".", features = ["test-support"] }
tempfile = "3.10"

[features]
failpoints = ["acdd-core/failpoints"]
test-support = []
