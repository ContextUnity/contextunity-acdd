# Reusable Spec schema for structured audit briefs (pair with acdd-workflow-examples/audit.yaml).
workflow: audit
roadmap: false
prefixes:
  - AUD
digits: 3
fields:
  type: object
  required:
    - target_system
    - severity_threshold
  additionalProperties: false
  properties:
    target_system:
      type: string
      minLength: 1
    severity_threshold:
      type: string
      enum: [low, medium, high, critical]
    owners:
      type: array
      items:
        type: string
items:
  probes:
    item: probe
    fields:
      type: object
      required:
        - question
        - scope
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
        scope:
          type: array
          minItems: 1
          items:
            type: string
        depends_on:
          type: array
          items:
            type: string
