# =============================================================================
# HIERARCHICAL ACDD PROFILE: Multi-Repo Umbrella Cross-Service Coordination
#
# Use case: Coordinated multi-repository initiative (e.g. backend, frontend, infra)
# Execution:
# - Each repo advances tasks in parallel isolated worktrees (`linked_workspaces`)
# - Cross-repo schema contracts are synthesized upfront (`cross_repo_synthesis`)
# - Autonomous umbrella integration gate verifies end-to-end compatibility before handoff
# =============================================================================

version: 2
inherit: none

git:
  isolation: worktree
  worktrees: manual
  commit_mode: plumbing
  integrate: manual

save: commit

# =============================================================================
# 1. ROLES CATALOG (`roles`)
# =============================================================================
roles:
  lead_architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:xhigh'
      - 'claude-opus-5.5'

  service_builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  integration_reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

# =============================================================================
# 2. COMMANDS CATALOG (`commands`)
# =============================================================================
commands:
  check_task:
    test_filter: "{test}"
    output: { require_counts: false }
    timeout_seconds: 90
    by_pattern:
      "backend/**/*.py": "cd backend && ruff check {scope_target} && pytest -q {scope_target} {test_filter}"
      "frontend/**/*.{ts,tsx,vue}": "cd frontend && npm run typecheck && npm test -- {scope_target} {test_filter}"
      "infra/**/*.{tf,yaml}": "cd infra && terraform fmt -check && terraform validate {test_filter}"

  verify_cross_repo_e2e:
    command: "./scripts/run-cross-service-integration.sh --env test --headless"
    timeout_seconds: 300
    output: { require_counts: false }

  check_all_services:
    command: "pytest backend/tests/ && npm --prefix frontend test && terraform -chdir=infra validate"
    timeout_seconds: 600

# =============================================================================
# 3. CONTOURS CATALOG (`contours`)
# =============================================================================
contours:
  cross_repo_compatibility:
    description: "Verify backward and forward wire compatibility."
    criteria:
      - "Ensure that schema additions are non-breaking and default-tolerant."
      - "Check that protobuf/OpenAPI/event schema changes preserve wire compatibility."

  isolation:
    description: "Verify service isolation across repositories."
    criteria:
      - "Verify that commits in service A do not introduce hard runtime dependencies on unreleased states of service B."

  paths:
    description: "Verify repository boundaries and file perimeters."
    criteria:
      - "Ensure changes are confined to the assigned service repository worktree."

# =============================================================================
# 4. GUIDANCE CATALOG (`guidance`)
# =============================================================================
guidance:
  umbrella.synthesis: >
    Analyze cross-service boundaries and data contracts across all repositories.
    Publish OpenAPI, protobuf, or event schemas in the blueprint proof and acdd_blackboard.
    Consumer services bind seam tests directly to the synthesized contract schema.

  service.code: >
    Implement production code confined to the assigned service repository worktree.
    Adhere strictly to the published cross-repo schema.

# =============================================================================
# 5. HIERARCHICAL GATES PIPELINE (`gates`)
# =============================================================================
gates:
  # Gate 1: Upfront Umbrella Contract Synthesis (Agent Gate)
  - id: cross_repo_synthesis
    role: lead_architect
    guidance: [umbrella.synthesis]

  # Gate 2: Parallel Multi-Repo Task Delivery Container
  - tasks:
      gates:
      - id: contract
        role: lead_architect
        command: check_task
        proof: contract
        expected_failure:
          exit_codes: [1]
        save:
          post: snapshot
        pass: implement

      - id: implement
        gates:
          - id: code
            role: service_builder
            guidance: [service.code]
            proof: none
            pass: verify_service

          - id: verify_service
            command: check_task
            proof: command
            fail: code
        pass: umbrella_integration_verify

      - id: umbrella_integration_verify
        command: verify_cross_repo_e2e
        proof: command
        pass: full_umbrella_verify
        fail: implement

      - id: full_umbrella_verify
        command: check_all_services
        proof: command
        pass: review
        fail: implement
        save:
          post: snapshot

      - id: review
        role: integration_reviewer
        proof: review
        contours:
          - cross_repo_compatibility
          - isolation
          - paths
        independent_from:
          - implement
        need:
          - full_umbrella_verify
        pass: deliver
        fail: implement
        save:
          immutable: true

      - id: deliver
        role: integration_reviewer
        receipt: true
        independent_from:
          - implement
        need:
          - review
        fail: implement
        save:
          immutable: true
          post: commit
