# =============================================================================
# ACDD PROFILE EXAMPLE: Full Milestone Profile (Root Gates + Tasks Container)
#
# ADR 0003 Unified Profile Engine: Worktree milestone contains upfront
# blueprint_synthesis (`synthesize` -> `review`), the per-task execution
# container (`tasks:` executed via DAG waves), and post-task closure
# (`verify`, `polish`, `integration_review`, `handoff`).
# =============================================================================

version: 2
inherit: none

git:
  isolation: worktree
  worktrees: manual
  commit_mode: plumbing
  integrate: manual

save: commit

git_commit_notes:
  default:
    ref_name: refs/notes/acdd
    max_bytes: 2048
    format: markdown
    sections:
      - duration
      - tasks_summary
      - review_cycles
      - diff_breakdown
      - test_suite
      - topology

roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:xhigh'

  contract_author:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:xhigh'

  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

scope_args_by_pattern:
  "src/main.rs": "--bin acdd"
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"

commands:
  rust-check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
      tests:
        target: '(?m)(?:^\s*Running\s+(?:unittests\s+)?|"kind":\s*\[[^\]]*"test"[^\]]*\].*?"src_path":\s*"|--test\s+)([^\s"\\)]+)'
        passed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ok\b'
        failed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+FAILED\b'
        ignored: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ignored\b'
    timeout_seconds: 300

  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    timeout_seconds: 1800

  test:
    command: "cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: false
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    description: "Scoped contract command for runtime-red seam testing."

contours:
  paths:
    description: "Verify changes stay within admitted write scope."
    criteria:
      - "Compare modified files against task scope."
  claims:
    description: "Verify accepted contract claims with fresh traces."
    criteria:
      - "Trace invariants to production code and passing checks."
  architecture:
    description: "Verify single-owner reuse, layer boundaries, minimal mechanism design, and absence of shadow subsystems or narrow heuristics."
    criteria:
      - "Confirm existing canonical owners and shared abstractions are reused instead of introducing duplicate helpers, parallel pipelines, or shadow resolvers."
      - "Verify strict layer boundaries, absence of narrow string/filename heuristics where structural data exists, and complexity proportional to the accepted contract."
  concurrency:
    description: "Verify CAS preconditions and lock ordering."
    criteria:
      - "Confirm revision fencing and rollback safety."
  project_isolation:
    description: "Verify confinement to the active workspace."
    criteria:
      - "Confirm paths and Git ops stay confined."
  administration:
    description: "Verify schema integrity and durable receipt commits."
    criteria:
      - "Verify commit tree parity and receipt signatures."

proofs:
  blueprint:
    description: "Architectural blueprint with grounded citations and per-task slices"
    schema:
      type: object
      required:
        - cited_invariants
        - cited_symbols
        - global_negative_boundaries
        - blackboard_decision_id
        - tasks
      properties:
        cited_invariants:
          type: array
          items: { type: string }
        cited_symbols:
          type: array
          items: { type: string }
        global_negative_boundaries:
          type: array
          items: { type: string }
        blackboard_decision_id: { type: string }
        tasks:
          type: object
          additionalProperties:
            type: object
            required:
              - layer
              - summary
              - exported_interfaces
              - negative_boundaries
              - incoming_seams
              - outgoing_seams
            properties:
              layer: { type: string }
              summary: { type: string }
              exported_interfaces:
                type: array
                items: { type: string }
              negative_boundaries:
                type: array
                items: { type: string }
              verification_seam: { type: string }
              incoming_seams:
                type: array
                items: { type: object }
              outgoing_seams:
                type: array
                items: { type: object }

gates:
  - id: blueprint_synthesis
    gates:
      - id: synthesize
        role: architect
        proof: blueprint
        save:
          post: none
        pass: review
      - id: review
        role: independent_reviewer
        proof: review
        contours: [claims, architecture, project_isolation, administration]
        independent_from: [synthesize]
        fail: synthesize
        save:
          immutable: true

  - tasks:
      gates:
        - id: contract
          role: contract_author
          proof: contract
          command: test
          expected_failure:
            exit_codes: [1, 101, 134]
          save:
            post: none
          pass: contract_review

        - id: contract_review
          role: independent_reviewer
          proof: review
          contours: [paths, claims, architecture]
          independent_from: [contract]
          need: [contract]
          save:
            immutable: true
          pass: build
          fail: contract

        - id: build
          role: builder
          command: rust-check-and-test
          proof: command
          save:
            post: none
          pass: review

        - id: review
          role: independent_reviewer
          proof: review
          contours: [paths, claims, architecture, concurrency, project_isolation, administration]
          independent_from: [build]
          need: [build]
          fail: build
          save:
            immutable: true
          pass: deliver

        - id: deliver
          role: independent_reviewer
          receipt: true
          need: [build, review]
          independent_from: [build]
          fail: build
          save:
            immutable: true
            post: commit
            git_commit_note: default

  - id: verify
    command: check_full_repo
    proof: command
    max_attempts: 2
    pass: integration_review
    fail: polish

  - id: polish
    role: builder
    scope:
      - ".acdd/profile.yaml"
      - ".acdd/profiles/**"
      - ".acdd/frameworks/**"
      - "docs/**"
      - "skills/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "README.md"
      - ".gitignore"
    command: check_full_repo
    proof: command
    pass: verify
    save:
      post: none

  - id: integration_review
    role: independent_reviewer
    proof: review
    max_attempts: 2
    contours: [paths, claims, architecture, concurrency, project_isolation, administration]
    independent_from: [polish, "tasks.build"]
    need: [verify]
    pass: handoff
    fail: polish
    save:
      immutable: true

  - id: handoff
    role: independent_reviewer
    independent_from: [polish, "tasks.build"]
    need: [verify, integration_review]
    receipt: true
    fail: polish
    save:
      immutable: true
      post: commit
      archive: true
      prune: true
      git_commit_note: default
