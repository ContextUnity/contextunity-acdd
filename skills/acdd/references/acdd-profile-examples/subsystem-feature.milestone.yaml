# =============================================================================
# ACDD SCENARIO EXAMPLE: Full Subsystem Milestone Profile
# File pattern: {scenario}.milestone.yaml (ADR 0003 — Unified Profile State Engine)
#
# Full worktree-isolated milestone overlay (`inherit: code`, `gates_merge: patch`):
# binds Rust verification commands onto the canonical `code` profile (`blueprint_synthesis`
# -> task DAG with `code.seam` checks -> `verify`/`polish`/`integration_review`/`handoff`).
# =============================================================================

version: 2
inherit: code
gates_merge: patch

save: commit

commands:
  test:
    command: "cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: false
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    timeout_seconds: 180

  rust-check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    timeout_seconds: 300

  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    timeout_seconds: 1200

gates:
  - id: tasks.build
    command: rust-check-and-test

  - id: verify
    command: check_full_repo

  - id: polish
    command: check_full_repo
