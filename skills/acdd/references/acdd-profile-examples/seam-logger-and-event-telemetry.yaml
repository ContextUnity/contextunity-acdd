# =============================================================================
# HIERARCHICAL ACDD PROFILE: SEAM TELEMETRY LOGGER & OBSERVABILITY PIPELINE
#
# Target Workflow:
# Demonstrates heterogeneous task coordination (code + docs + observer) using
# tag-based `when:` blocks, `checks: [code.seam]`, and autonomous 0-token
# Command Gates dispatching seam telemetry upon delivery.
# =============================================================================

version: 2
inherit: none

git:
  isolation: worktree
  worktrees: manual
  commit_mode: plumbing
  integrate: manual

save: commit

tags:
  - code
  - docs
  - observer
  - public_api

# =============================================================================
# 0. GIT COMMIT NOTE & RESOURCE BUDGETS
# =============================================================================
git_commit_notes:
  default:
    ref_name: refs/notes/acdd
    max_bytes: 2048
    format: markdown
    sections:
      - duration
      - tasks_summary
      - review_cycles
      - diff_breakdown
      - test_suite
      - topology

limits:
  max_metadata_bytes: 2048
  max_trace_summary_bytes: 2048

# =============================================================================
# 1. ROLES CATALOG (`roles`)
# =============================================================================
roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:xhigh'
      - 'claude-opus-5.5'

  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'
      - 'claude-opus-5.5'

  reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'
      - 'claude-opus-5.5'

  doc_writer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:medium'

# =============================================================================
# 2. COMMANDS CATALOG (`commands`)
# =============================================================================
commands:
  check_task:
    test_filter: "{test}"
    by_pattern:
      "**/*.py": "pytest {scope_target} {test_filter} --quiet"
      "**/*.{ts,tsx}": "npm test -- {scope_target} {test_filter}"
      "**/*.rs": "cargo clippy --lib --test {scope_target} -- -D warnings && cargo test --test {scope_target} {test_filter} -- --nocapture"
    timeout_seconds: 60

  check_docs:
    command: "acdd docs check"
    timeout_seconds: 30
    output: { require_counts: false }

  check_full_repo:
    command: "cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    timeout_seconds: 600

  dispatch_seam_webhook:
    command: >
      curl -s -f -X POST "${SEAM_OBSERVABILITY_URL:-https://httpbin.org/post}" \
        -H "Content-Type: application/json" \
        -H "X-ACDD-Event: seam.integrated" \
        -d "{\"run\":\"$ACDD_RUN_ID\",\"node\":\"$ACDD_NODE_CURSOR\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
        || echo "Seam telemetry dispatched locally (fallback)"
    timeout_seconds: 15
    output: { require_counts: false }

  notify_seam_blackboard:
    command: >
      acdd blackboard post \
        --run "$ACDD_RUN_ID" \
        --topic notes \
        --payload "Node $ACDD_NODE_CURSOR reconciled in $ACDD_WORKTREE"
    timeout_seconds: 10
    output: { require_counts: false }

# =============================================================================
# 3. CONTOURS CATALOG (`contours`)
# =============================================================================
contours:
  paths:
    description: "Verify change boundaries: all modified files must be strictly within admitted scope."
    criteria:
      - "Compare every changed file with task scope."
  claims:
    description: "Verify evidence: every acceptance claim must be proven by a reproducible test run."
    criteria:
      - "Confirm each admitted contract claim has at least one passing seam test."
  concurrency:
    description: "Verify thread safety, SQLite transaction fences, and lock acquisition order."
    criteria:
      - "Check transaction boundaries and concurrency safety."
  project_isolation:
    description: "Verify workspace isolation: ensure zero modification to sibling/external workspaces."
    criteria:
      - "Confirm workspace resolution uses active repository root."
  administration:
    description: "Verify administrative integrity: no unauthorized edits to receipts or Git hooks."
    criteria:
      - "Verify profile hashes and compiled gate references fail closed on tampering."

# =============================================================================
# 4. GUIDANCE CATALOG (`guidance`)
# =============================================================================
guidance:
  milestone.synthesis: >
    Analyze requirements across all tasks. Group code, doc, and observer tasks
    into parallel waves and record the architectural decision via acdd_blackboard.

  task.contract: >
    Author additive production-seam test for this task. Verify runtime-red assertion
    failure (exit 101/1/134) with clear assertion message.

  task.code: >
    Implement minimal code to turn the red seam test green. Stay strictly within task scope.

  task.doc_audit: >
    Update documentation, architecture records (ADRs), and user guides to reflect newly
    introduced interfaces. Verify all clickable file links and markdown anchors.

  milestone.review: >
    Evaluate integrated run changes against invariants and ADRs.
    Confirm all seam receipts and telemetry events were verified.

# =============================================================================
# 5. PROOFS CATALOG (`proofs`)
# =============================================================================
proofs:
  blueprint:
    description: "Architectural blueprint with grounded citations"
    schema:
      type: object
      required: [cited_invariants, cited_symbols, blackboard_decision_id]
      properties:
        cited_invariants: { type: array, items: { type: string } }
        cited_symbols: { type: array, items: { type: string } }
        blackboard_decision_id: { type: string }

# =============================================================================
# 6. HIERARCHICAL GATES TREE (`gates`)
# =============================================================================
gates:
  - id: blueprint_synthesis
    gates:
      - id: synthesize
        role: architect
        proof: blueprint
        guidance: [milestone.synthesis]
        save:
          pre: snapshot
          post: snapshot
        pass: review
      - id: review
        role: reviewer
        proof: review
        contours: [paths, claims, concurrency, project_isolation, administration]
        independent_from: [synthesize]
        fail: synthesize
        save:
          immutable: true

  - tasks:
      gates:
      - id: contract
        command: check_task
        when: code
        role: architect
        guidance: [task.contract]
        proof: contract
        checks: [code.seam]
        expected_failure:
          exit_codes: [1, 101, 134]
        save:
          post: snapshot
        pass: build

      - id: build
        when: code
        role: builder
        guidance: [task.code]
        command: check_task
        proof: command
        checks: [code.seam]
        save:
          pre: snapshot
          post: snapshot
        pass: review

      - id: doc_audit
        when: docs
        role: doc_writer
        guidance: [task.doc_audit]
        command: check_docs
        proof: command
        save:
          pre: snapshot
          post: snapshot
        pass: review

      - id: review
        role: reviewer
        proof: review
        contours: [paths, claims, concurrency, project_isolation, administration]
        independent_from: [build]
        fail: build
        save:
          immutable: true
        pass: telemetry_notify

      - id: telemetry_notify
        command: dispatch_seam_webhook
        proof: command
        pass: blackboard_notify
        fail: build

      - id: blackboard_notify
        command: notify_seam_blackboard
        proof: command
        pass: deliver
        fail: build

      - id: deliver
        role: reviewer
        receipt: true
        need: [review, blackboard_notify]
        independent_from: [build]
        fail: build
        save:
          immutable: true
          post: commit
          git_commit_note: default

  - id: verify
    command: check_full_repo
    proof: command
    pass: integration_review

  - id: integration_review
    role: reviewer
    guidance: [milestone.review]
    proof: review
    contours: [paths, claims, concurrency, project_isolation, administration]
    independent_from: ["tasks.build"]
    need: [verify]
    pass: handoff
    save:
      immutable: true

  - id: handoff
    role: reviewer
    independent_from: ["tasks.build"]
    need: [verify, integration_review]
    receipt: true
    save:
      immutable: true
      post: commit
      archive: true
      prune: true
      git_commit_note: default
