# =============================================================================
# ACDD SCENARIO EXAMPLE: In-Place Feature / Refactor Plan Profile
# File pattern: {scenario}.plan.yaml (ADR 0003 — Unified Profile State Engine)
#
# Executes plan tasks and subtasks in the active working tree (`git.isolation: in_place`,
# `save: none`, zero automatic commits), omitting milestone blueprint/contract/handoff gates.
# Switch `inherit: none` to `inherit: in_place` or `inherit: workspace` to inherit
# repository `roles`, `runner`, `commands`, and `scope_args_by_pattern`.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: plumbing
  integrate: manual

save: none

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

contours:
  paths:
    description: "Verify changes stay within admitted write scope."
    criteria:
      - "Compare modified files with task scope."
  claims:
    description: "Verify build evidence and passing test counts."
    criteria:
      - "Confirm scoped clippy and tests pass cleanly."
  architecture:
    description: "Verify single-owner reuse, layer boundaries, minimal mechanism design, and absence of shadow subsystems or narrow heuristics."
    criteria:
      - "Confirm existing canonical owners and shared abstractions are reused without duplicate helpers or parallel pipelines."
      - "Verify strict layer boundaries, zero narrow string heuristics where structural data exists, and proportional complexity."

scope_args_by_pattern:
  "src/**/*.rs": "--lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "tests/acdd/**/*.rs": "--test acdd"

commands:
  rust-check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    timeout_seconds: 300

gates:
  - tasks:
      gates:
        - id: build
          role: builder
          command: rust-check-and-test
          proof: command
          save:
            post: none
          pass: review

        - id: review
          role: independent_reviewer
          proof: review
          contours:
            - paths
            - claims
            - architecture
          independent_from:
            - build
          need:
            - build
          pass: deliver
          fail: build
          save:
            immutable: true

        - id: deliver
          role: independent_reviewer
          receipt: true
          need:
            - build
            - review
          independent_from:
            - build
          fail: build
          save:
            immutable: true
            post: none
