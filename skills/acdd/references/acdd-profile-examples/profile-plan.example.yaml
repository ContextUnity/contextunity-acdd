# =============================================================================
# ACDD PROFILE EXAMPLE: Plan Profile (Only Tasks Container, No Root Gates)
#
# ADR 0003 Unified Profile Engine: Plan executes in-place steps without pre-task
# synthesis (`blueprint_synthesis`) or post-task closure (`verify`/`polish`/`handoff`).
# It consists strictly of the `tasks:` container with `git.isolation: in_place`
# and `save: snapshot`.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: plumbing
  integrate: manual

save: snapshot

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

contours:
  paths:
    description: "Verify changes stay within admitted write scope."
    criteria:
      - "Compare modified files against task scope."
  claims:
    description: "Verify accepted claims with fresh command traces."
    criteria:
      - "Confirm clippy and tests pass cleanly."

scope_args_by_pattern:
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "tests/acdd/**/*.rs": "--test acdd"

commands:
  rust-check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
      tests:
        target: '(?m)(?:^\s*Running\s+(?:unittests\s+)?|"kind":\s*\[[^\]]*"test"[^\]]*\].*?"src_path":\s*"|--test\s+)([^\s"\\)]+)'
        passed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ok\b'
        failed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+FAILED\b'
        ignored: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ignored\b'
    timeout_seconds: 300

gates:
  - tasks:
      gates:
        - id: build
          role: builder
          command: rust-check-and-test
          proof: command
          save:
            pre: snapshot
            post: snapshot
          pass: review

        - id: review
          role: independent_reviewer
          proof: review
          contours:
            - paths
            - claims
          independent_from:
            - build
          need:
            - build
          pass: deliver
          fail: build
          save:
            immutable: true

        - id: deliver
          role: independent_reviewer
          receipt: true
          need:
            - build
            - review
          independent_from:
            - build
          fail: build
          save:
            immutable: true
            post: snapshot
