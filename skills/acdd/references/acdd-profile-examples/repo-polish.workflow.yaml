# =============================================================================
# ACDD SCENARIO EXAMPLE: Resource-Inheriting Repository Polish Workflow
# File pattern: {scenario}.workflow.yaml (ADR 0003 — Unified Profile State Engine)
#
# Demonstrates a stateless polish workflow (`verify_repo` -> `polish` ->
# `review_polish`) reusing repository role/command conventions with `save: none`.
# Structural template: with `inherit: none`, bind `runner:` per role before
# running `acdd run --profile ...`; `inherit: workspace` can reuse compatible
# roles and commands from the workspace.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: manual
  integrate: manual

save: none

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  check_full_repo:
    command: "cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    timeout_seconds: 1200

gates:
  - id: verify_repo
    command: check_full_repo
    proof: command
    pass: review_polish
    fail: polish

  - id: polish
    role: builder
    command: check_full_repo
    max_attempts: 3
    proof: &polish_decision
      scheme:
        type: object
        required: [decision, summary]
        properties:
          decision: { type: string, enum: [pass, reject] }
          summary: { type: string }
    pass: verify_repo

  - id: review_polish
    role: independent_reviewer
    independent_from:
      - polish
    need:
      - verify_repo
    max_attempts: 2
    proof: *polish_decision
    fail: polish
