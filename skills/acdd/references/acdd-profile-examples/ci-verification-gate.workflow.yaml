# =============================================================================
# ACDD SCENARIO EXAMPLE: Standalone Clean-Room CI Verification Gate
# File pattern: {scenario}.workflow.yaml (ADR 0003 — Unified Profile State Engine)
#
# Self-contained CI verification pipeline (`inherit: none`, `save: none`) suitable
# for headless CI environments and pre-release checks without tasks or worktrees.
# Structural template: configure `runner:` per role (or switch to `inherit: workspace`)
# before launching `acdd run --profile ...`.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: manual
  integrate: manual

save: none

roles:
  ci_fixer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  release_auditor:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  lint_and_fmt:
    command: "cargo fmt --check && cargo clippy --workspace --all-targets --all-features -- -D warnings"
    output:
      require_counts: false
    timeout_seconds: 600

  workspace_tests:
    command: "cargo test --workspace --lib"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      compile_errors:
        include: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
        exclude: ['^error: test failed']
    timeout_seconds: 1200

contours:
  reproducibility:
    description: "Verify deterministic builds and clean git status after checks."
    criteria:
      - "Verify deterministic builds and clean git status after checks."
  regressions:
    description: "Verify zero skipped or weakened assertions across test suites."
    criteria:
      - "Verify zero skipped or weakened assertions across test suites."

gates:
  - id: verify_lint
    command: lint_and_fmt
    proof: command
    pass: verify_tests
    fail: repair

  - id: verify_tests
    command: workspace_tests
    proof: command
    pass: release_audit
    fail: repair

  - id: repair
    role: ci_fixer
    command: workspace_tests
    max_attempts: 3
    proof: &gate_decision
      scheme:
        type: object
        required: [decision, summary]
        properties:
          decision: { type: string, enum: [pass, reject] }
          summary: { type: string }
    pass: verify_lint

  - id: release_audit
    role: release_auditor
    contours:
      - reproducibility
      - regressions
    independent_from:
      - repair
    need:
      - verify_tests
    max_attempts: 2
    proof: *gate_decision
    fail: repair
