version: 2
inherit: none
save: none

contours:
  paths:
    description: "Verify paths"
    criteria: ["Verify scope"]
  claims:
    description: "Verify claims"
    criteria: ["Verify claims"]
  concurrency:
    description: "Verify concurrency"
    criteria: ["Verify concurrency"]
  project_isolation:
    description: "Verify isolation"
    criteria: ["Verify isolation"]
  administration:
    description: "Verify administration"
    criteria: ["Verify administration"]

roles:
  architect: {}
  builder: {}
  independent_reviewer:
    reuse_on_reject: false

commands:
  rust-check-and-test:
    command: ": {scope_target} && rustc --test tests/runner_fixture.rs -o .acdd/runner_fixture && .acdd/runner_fixture"
  check_full_repo:
    command: "mkdir -p .acdd && printf '%4096s' '' | tr ' ' x && echo full-output-tail && echo check >> .acdd/verification-order && test ! -f .acdd/fail-check"
    description: "Fixture check command for milestone verification."
    timeout_seconds: 30

gates:
  - tasks:
      gates:
        - id: build
          role: builder
          proof: command
          command: rust-check-and-test
          save:
            post: none
          pass: review
        - id: review
          role: independent_reviewer
          proof: review
          independent_from: [build]
          contours:
            - paths
            - claims
            - concurrency
            - project_isolation
            - administration
          fail: build
        - id: deliver
          need: [build, review]
          receipt: true
          save: none
