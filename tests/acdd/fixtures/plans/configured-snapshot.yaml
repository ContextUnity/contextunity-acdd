version: 2
inherit: none
save: none
commands:
  implement:
    command: "printf 'implementation\n' >> src/first.rs"
    output: { require_counts: false }
gates:
  - tasks:
      gates:
        - id: implement
          command: implement
          save: { post: none }
        - id: finish
          need: [implement]
          receipt: true
          save: none
