version: 2
inherit: none
save: none
commands:
  prepare:
    command: "printf 'candidate\n' > src/first.rs"
    output: { require_counts: false }
  mutate:
    command: "printf 'changed\n' > src/first.rs"
    output: { require_counts: false }
gates:
  - tasks:
      gates:
        - id: prepare
          command: prepare
          save:
            post: none
        - id: review
          command: mutate
          save:
            immutable: true
        - id: finish
          need: [prepare, review]
          receipt: true
          save: none
