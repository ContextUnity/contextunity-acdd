version: 2
inherit: code
tags: [default, docs]

commands:
  rust-check-and-test: &build_check_cmd
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter} && cargo test --test commitment_integrity"
    test_filter: "{test}"
    description: "Run strict Rust checks, the scoped test suite, and commitment_integrity boundary fences."

  build_check: *build_check_cmd

  check_full_repo: &verify_all_cmd
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 1800

  verify_all: *verify_all_cmd

scope_args_by_pattern:
  "src/main.rs": "--bin acdd"
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"
  "tests/common/**/*.rs": "--all-targets"
  "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
  "tests/core/**/*.rs": "--test core"
  "tests/framework_manifests/**/*.rs": "--test languages"
  "tests/incremental/**/*.rs": "--test core"
  "tests/languages/**/*.rs": "--test languages"
  "tests/linker/**/*.rs": "--test linker"
  "tests/mcp/**/*.rs": "--test mcp"
  "tests/mcp_context/**/*.rs": "--test mcp"
  "tests/query_context/**/*.rs": "--test query_context"
  "tests/receivers/**/*.rs": "--test linker"

guidance:
  repo.tests: "Follow `tests/AGENTS.md` and `docs/architecture/test-harness.md`: keep `RunHarness::in_memory()` / unit scenarios `< 5 ms`, focused integration tests `< 1 s`, `tests/acdd < 15 s`, set `commit.gpgsign=false` in fixture Git setups, and verify zero `/tmp/contextunity-test-*` leaks (`BEFORE == AFTER`)."

gates_patch:
  - id: tasks.build
    guidance: [task.code, core.execution, code.principles, code.tools, repo.tests, hitl.pro]
  - id: tasks.review
    guidance: [task.review, core.review, code.principles, code.tools, repo.tests, hitl.pro]

