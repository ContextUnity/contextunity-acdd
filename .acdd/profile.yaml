version: 2
inherit: default

commands:
  check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target}"
    output: &test_output
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      errors: ['^error(\[E\d+\])?:', 'panicked at', '^FAIL ']
      tests:
        target: '(?m)(?:^\s*Running\s+(?:unittests\s+)?|"kind":\s*\[[^\]]*"test"[^\]]*\].*?"src_path":\s*"|--test\s+)([^\s"\\)]+)'
        passed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ok\b'
        failed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+FAILED\b'
        ignored: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ignored\b'
    description: "Run strict Rust checks followed by the repository's test suite."
  rust-check-and-test:
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target}"
    output: *test_output
    description: "Run strict Rust checks followed by the repository's test suite."
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 1800
  test:
    command: "cargo test"
    description: "Run scoped tests for red contract proof."

scope_args_by_pattern:
  "src/main.rs": "--bin acdd"
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-tasks/**/*.rs": "--package acdd-tasks --lib"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"
  "tests/common/**/*.rs": "--all-targets"
  "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
  "tests/core/**/*.rs": "--test core"
  "tests/framework_manifests/**/*.rs": "--test framework_manifests"
  "tests/incremental/**/*.rs": "--test incremental"
  "tests/languages/**/*.rs": "--test languages"
  "tests/linker/**/*.rs": "--test linker"
  "tests/mcp/**/*.rs": "--test mcp"
  "tests/mcp_context/**/*.rs": "--test mcp"
  "tests/query_context/**/*.rs": "--test query_context"
  "tests/receivers/**/*.rs": "--test linker"

guidance:
  task.repo_testing:
    description: "Repository test placement, fixture reuse, and verification reminders (TESTS.md / tests/AGENTS.md)"
    criteria:
      - "ZERO NEW ROOT BINARIES: Place new integration test modules inside tests/core.rs, tests/mcp.rs, tests/query_context.rs, tests/linker.rs, tests/incremental.rs, or tests/acdd.rs; never add standalone tests/*.rs binaries or tautological meta-tests."
      - "FIXTURE & MATRIX HYGIENE: NEVER store Workspace or TempDir inside static OnceLock/LazyLock (statics skip Drop and leak /tmp/contextunity-test-*); share immutable SQLite corpora via OnceLock<PersistedSnapshot> (tests/common/sqlite.rs) so seed Workspaces drop in get_or_init, or use local Workspaces for disk/MCP suites. Prove pure DAG/gate/blackboard rules in-process via TasksStore/TaskHarness, collapse variants into table-driven loops with Workspace::new()/.build() outside the loop (unless cold layout differs), and keep leaked temp dirs at zero."
      - "VERIFICATION BOUNDARY: Keep contract tests runtime-red (exit 101) without weakens/skips, and run strict Clippy (`cargo clippy ... -- -D warnings`) plus scoped `cargo test --test <target>` before passing build/review."

gates:
  - tasks:
      gates:
        - id: contract
          command: test
          guidance: [task.contract, task.repo_testing, hitl.pro]
        - id: build
          command: rust-check-and-test
          guidance: [task.code, task.repo_testing, hitl.pro]
        - id: review
          guidance: [task.review, task.repo_testing, hitl.pro]
        - id: seam
          gates:
            - id: integrate
              command: rust-check-and-test
              guidance: [task.deferred_final_test, task.repo_testing, hitl.pro]
            - id: review
              guidance: [task.seam_review, task.repo_testing, hitl.pro]

  - id: verify
    command: check_full_repo
