version: 2
inherit: code
tags: [default, docs]

commands:
  rust-check-and-test: &build_check_cmd
    by_pattern:
      "crates/acdd-index/src/languages/**": "cargo clippy --package acdd-index --lib --all-features -- -D warnings && cargo clippy --test languages --test linker --all-features -- -D warnings && cargo test --package acdd-index --lib && cargo test --test languages --test linker {test_filter} && cargo test --test commitment_integrity"
      "crates/acdd-index/src/linker/**": "cargo clippy --package acdd-index --lib --all-features -- -D warnings && cargo clippy --test languages --test linker --all-features -- -D warnings && cargo test --package acdd-index --lib && cargo test --test languages --test linker {test_filter} && cargo test --test commitment_integrity"
      "**": "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter} && cargo test --test commitment_integrity"
    test_filter: "{test}"
    description: "Run strict Rust checks, the scoped test suite (including cross-package languages/linker suites), and commitment_integrity boundary fences."

  build_check: *build_check_cmd

  check_full_repo: &verify_all_cmd
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --all-targets && cargo run -q -- docs check && cargo run -q -- validate && ./scripts/test-macos-ssh.sh"
    description: "Run Linux workspace checks/tests, docs/config validation, and macOS SSH verification."
    timeout_seconds: 1800

  verify_all: *verify_all_cmd

scope_args_by_pattern:
  "src/main.rs": "--bin acdd"
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "crates/acdd-state/tests/**/*.rs": "--package acdd-state --test state_integration"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"
  "tests/common/**/*.rs": "--all-targets"
  "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
  "tests/core/**/*.rs": "--test core"
  "tests/framework_manifests/**/*.rs": "--test languages"
  "tests/incremental/**/*.rs": "--test core"
  "tests/languages/**/*.rs": "--test languages"
  "tests/linker/**/*.rs": "--test linker"
  "tests/mcp/**/*.rs": "--test mcp"
  "tests/mcp_context/**/*.rs": "--test mcp"
  "tests/query_context/**/*.rs": "--test query_context"
  "tests/receivers/**/*.rs": "--test linker"

roles:
  architect:
    models:
      - gemini-4-neon-xhigh
      - gemini-4-hydrogen-xhigh
  builder:
    models:
      - gemini-4-hydrogen-high
  independent_reviewer:
    models:
      - gemini-4-neon-xhigh
      - gemini-4-neon-high
  coordinator:
    mode: inline
    reuse_on_reject: true
    guidance: "Execute inline as the main coordinator agent: synthesize milestone telemetry, cycle history, code quality assessment, and rule updates into gitignored docs/memories/<spec.name>.md before submitting handoff."

guidance:
  code.tools:
    description: "ACDD NAVIGATION & HYGIENE PROTOCOL"
    criteria:
      - "Worker 2-step startup: (1) call `acdd_claim` / `acdd claim` FIRST to obtain `ClaimResp.worktree`, then (2) index/sync that worktree via `acdd --root <ClaimResp.worktree> build` (or MCP `worktree`) before reading or querying code."
      - "Mandatory ACDD navigation: use MCP (`code_map_*`, `ast_grep_search`, `acdd_read`, `search_docs`, `get_doc`) whenever available; if MCP is unavailable in your harness (e.g. `swarm` workers), you MUST use `acdd` CLI equivalents (`acdd read --selector|--start-line --line-count|--mode search`, `acdd query search|inspect|impact|tests|overview`, `acdd ast grep`, `acdd docs search|get`, refreshing worktree index via `acdd --root <ClaimResp.worktree> build`/`delta`)."
      - "NEVER bypass ACDD with `read_file`, `cat`, `head`, `tail`, `sed`, or bare `grep`/`rg` on indexed code/docs; reserve `rg -n` strictly for unadmitted/gitignored paths or exact literals when indexed text search is insufficient."
      - "Before deleting or changing public symbols, run `code_map_impact`/`tests`/`prove_removal` (CLI: `acdd query impact|tests|remove`); before submitting any `build`, `polish`, or `review`, run `code_map_lint` (`acdd lint --categories all`) and `code_map_query(duplicates, dead_tails)` (`acdd query run duplicates|dead_tails`)."
      - "Do NOT run inline Python (`python -c` / heredocs) or write ad-hoc `.py` verification scripts — use native Rust tests or `acdd` CLI."
  repo.rust:
    description: "RUST HOT-PATH & CODEC STANDARDS"
    criteria:
      - "Model finite variants with closed `enum`s, validated newtypes, `From`/`TryFrom`, `&dyn Trait`, and non-generic inner fns (no mirror `Mcp*` structs or magic strings)."
      - "Borrow `&str`/`&Path`/`Cow<'_, str>` and intern repeated symbols (`Arc<str>`, `CompactTag`); hash via `acdd_core::format::sha256_serde_json` and bind codecs with `struct_codecs!`."
      - "Batch Git/SQLite/spec reads (`git cat-file --batch`, single `ls-tree`, preloaded `BTreeMap`); prove `Ok(None) => slow_path` non-fallbacks and benchmark CLI hot paths (`index`, `query`, `roadmap`, `validate`) on `--release`."
      - "STOP before adding language-name checks in universal `linker/{value_flow,resolution,semantic_context}/` or `db/lint/` modules or writing a parallel parser/lexer when upstream extractor/manifest metadata is missing: extend the language extractor/profile instead or escalate."
  repo.tests:
    description: "REPOSITORY TEST BUDGETS"
    criteria:
      - "Keep `RunHarness::in_memory()`/unit tests `< 5 ms`, focused integration tests `< 1 s`, `tests/acdd < 15 s` (`tests/AGENTS.md`, `docs/architecture/test-harness.md`)."
      - "STOP before writing FS/`temp_dir`/`Workspace` tests inside `crates/**/src/**` `#[cfg(test)]`: add matrix rows to existing canonical integration binaries (`tests/<domain>.rs`)."
      - "Set `commit.gpgsign=false` in fixture Git setups and verify zero `/tmp/contextunity-test-*` leaks (`BEFORE == AFTER`)."
  repo.memory_synthesis:
    description: "PRE-HANDOFF MILESTONE MEMORY & TELEMETRY SYNTHESIS"
    criteria:
      - "Before submitting `handoff`, analyze the full milestone run using `acdd_state(action: \"show\")` (or `acdd show <run>`), `.acdd/state.sqlite` read-only data (`runs`, `gate_nodes`, `gate_claims`, `gate_traces`, `gate_artifacts`, `blackboard`), `git log --stat <target_base_commit>..HEAD`, and session/subagent usage logs."
      - "Compile per-task and run-wide statistics: elapsed wall time (run/claim/trace timestamps), token usage per worker/task (when exposed by the harness, or `N/A` when unavailable), loop/cycle counts (`attempt`, `cycle_count`, `build <-> review` rounds, `rearchitect` drift), trace pass/fail counts, scope extensions, and blackboard decisions/deferred counts."
      - "Write the structured retrospective to `docs/memories/<spec.name>.md` (spec ID/file stem, or `<run_name>.md` for ephemeral `--goal` runs; `/docs/memories/` is gitignored so writing it preserves `claim_tree` with zero extra commits) covering: (1) telemetry table, (2) what went well, (3) what went wrong / friction & bottlenecks, (4) code quality assessment (architecture, SSOT/types, clones/dead_tails, hot-path & test quality), and (5) concrete rule/profile update recommendations (`AGENTS.md`, crate `AGENTS.md`, `skills/`, `.acdd/profile.yaml`, `code.yaml`)."

gates_patch:
  - id: tasks.build
    checks:
      - code.seam
      - check: code.lint
        with:
          categories:
            - arch
            - syntax
            - docs
            - duplicates
            - dead_tails
            - cycles
    guidance: [task.code, core.execution, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
  - id: tasks.review
    guidance: [task.review, core.review, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
  - id: tasks.rearchitect
    guidance: [task.rearchitect, core.execution, code.principles, code.tools, repo.rust, hitl.pro]
  - id: run_tests
    command: check_full_repo
    checks:
      - check: code.lint
        with:
          categories:
            - arch
            - syntax
            - docs
            - duplicates
            - dead_tails
            - cycles
  - id: integration_review
    guidance: [milestone.review, core.review, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
  - id: handoff
    role: coordinator
    guidance: [milestone.handoff, repo.memory_synthesis, core.execution, hitl.pro]

