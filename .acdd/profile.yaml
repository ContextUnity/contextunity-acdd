version: 2
inherit: code
gates_merge: patch
tags: [default, docs]

commands:
  rust-check-and-test: &build_check_cmd
    command: "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter} && cargo test --test commitment_integrity"
    test_filter: "{test}"
    output: &test_output
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      compile_errors:
        include: ['^error(\[E\d+\])?:']
        exclude: ['^error: test failed']
      tests:
        target: '(?m)(?:^\s*Running\s+(?:unittests\s+)?|"kind":\s*\[[^\]]*"test"[^\]]*\].*?"src_path":\s*"|--test\s+)([^\s"\\)]+)'
        passed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ok\b'
        failed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+FAILED\b'
        ignored: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ignored\b'
    description: "Run strict Rust checks, the scoped test suite, and commitment_integrity boundary fences."

  build_check: *build_check_cmd

  test:
    command: "cargo test {scope_target} {test_filter}"
    test_filter: "{test}"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: false
      noise: ['^\s*(Compiling|Downloading|Finished|Checking)\b', '^✔']
      compile_errors:
        include: ['^error(\[E\d+\])?:']
        exclude: ['^error: test failed']
      tests:
        target: '(?m)(?:^\s*Running\s+(?:unittests\s+)?|"kind":\s*\[[^\]]*"test"[^\]]*\].*?"src_path":\s*"|--test\s+)([^\s"\\)]+)'
        passed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ok\b'
        failed: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+FAILED\b'
        ignored: '(?m)^test\s+([A-Za-z0-9_:]+)\s+\.\.\.\s+ignored\b'
    description: "Run scoped Rust contract tests for runtime-red proof."

  check_full_repo: &verify_all_cmd
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    output: *test_output
    description: "Run the milestone handoff verification commands from TESTS.md."
    timeout_seconds: 1800

  verify_all: *verify_all_cmd

scope_args_by_pattern:
  "src/main.rs": "--bin acdd"
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"
  "tests/common/**/*.rs": "--all-targets"
  "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
  "tests/core/**/*.rs": "--test core"
  "tests/framework_manifests/**/*.rs": "--test languages"
  "tests/incremental/**/*.rs": "--test core"
  "tests/languages/**/*.rs": "--test languages"
  "tests/linker/**/*.rs": "--test linker"
  "tests/mcp/**/*.rs": "--test mcp"
  "tests/mcp_context/**/*.rs": "--test mcp"
  "tests/query_context/**/*.rs": "--test query_context"
  "tests/receivers/**/*.rs": "--test linker"

guidance:
  task.repo_testing:
    description: "ContextUnity-ACDD Rust test topology, fixture hygiene, lowest-level placement, and speed invariants (TESTS.md / tests/AGENTS.md)"
    criteria:
      - "CANONICAL BINARY & META-TEST BUDGET: Register new integration modules strictly inside the 7 canonical tests/*.rs binaries (acdd.rs, core.rs, mcp.rs, query_context.rs, linker.rs, languages.rs, commitment_integrity.rs); never add standalone top-level tests/*.rs binaries, docs/ADR/YAML substring meta-tests, or helper self-tests."
      - "LOWEST-LEVEL PLACEMENT & SUBPROCESS BOUNDARY: Keep exhaustive parser, graph, profile, and error-permutation #[test] matrices in-memory inside owning crate unit modules (crates/*/src/); keep tests/acdd/ and tests/mcp/ as thin CLI/MCP seam proofs without re-cloning unit matrices. Reserve WaveHarness, python3, and git subprocesses strictly for process, signal, timeout, or worktree seams; drive pure DAG/gate/blackboard rules in-process via RunHarness / StateEngine (see tests/AGENTS.md)."
      - "HARNESS SHARING & ZERO /tmp LEAKS: Construct shared Workspace::new(), McpTestHarness::new(), and RunHarness instances ONCE outside table loops, partitioning clean read-only baseline rows before mutating rows to avoid redundant restores. Preserve root/directory permissions on restore and repair read-only entries in Workspace::drop instead of swallowing errors. Never store Workspace or TempDir inside static OnceLock/LazyLock; share read-only indexed corpora via OnceLock<PersistedSnapshot> (tests/common/sqlite.rs) and require zero leaked /tmp/contextunity-test-* directories (BEFORE == AFTER)."
      - "SPEED, DETERMINISM & REVIEW BUDGET: Ban arbitrary thread::sleep and inflated fixed timeouts where deterministic readiness markers or signals synchronize child processes cleanly. Keep contract proofs compiling cleanly and failing at runtime (exit 101) without weakens or #[ignore], maintain zero net new #[test] functions during review remediation, and verify strict Clippy (`cargo clippy <scope_target> --all-features -- -D warnings`) plus scoped `cargo test <scope_target>` before passing build/review."

  task.repo_architecture:
    description: "ContextUnity-ACDD canonical ownership, reuse-first lookup, complexity budget, and layer purity (src/AGENTS.md)"
    criteria:
      - "REUSE-FIRST CANONICAL LOOKUP & ACDD MCP PRIORITY: Search existing canonical owners across `acdd_core`, `acdd_index`, `acdd_state`, and `src/` with ACDD MCP tools (`code_map_search`, `code_map_inspect`, `code_map_impact`, `code_map_query`, `acdd_read`, `ast_grep_search`) before falling back to shell `grep`/`rg`, blind full-file reads, or authoring helpers, Git/FS wrappers, glob matchers, shell templates, or graph passes; extend or reuse the canonical owner (`INV-SINGLE-OWNER`)."
      - "COMPLEXITY-BUDGET ESCALATION: Escalate to the coordinator via `acdd_blackboard` (`topic: decisions` / `--action escalate`) before introducing any new subsystem/parallel pipeline or exceeding proportional defect-fix growth (`> ~80-100` net production LOC)."
      - "LAYER PURITY & ZERO HEURISTICS: Strictly ban narrow language string/path heuristics where indexed AST/linker graphs exist, and strictly ban raw `Command::new(\"git\")` outside `acdd_core::git`."

gates:
  - tasks:
      gates:
        - id: contract
          command: test
          guidance:
            - task.contract
            - task.repo_testing
            - task.repo_architecture
            - hitl.pro
        - id: build
          command: rust-check-and-test
          guidance:
            - task.code
            - task.repo_testing
            - task.repo_architecture
            - hitl.pro
        - id: review
          guidance:
            - task.review
            - task.repo_testing
            - task.repo_architecture
            - hitl.pro
        - id: rearchitect
          guidance:
            - task.rearchitect
            - task.repo_architecture
            - hitl.pro

  - id: verify
    command: check_full_repo

  - id: polish
    command: check_full_repo
    guidance:
      - milestone.polish
      - task.repo_testing
      - task.repo_architecture
      - hitl.pro
