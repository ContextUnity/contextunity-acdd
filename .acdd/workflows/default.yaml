version: 2
inherit: code
tags: [default, docs]

commands:
  rust-check-and-test: &build_check_cmd
    by_pattern:
      "crates/acdd-index/src/languages/**": "cargo clippy --package acdd-index --lib --all-features -- -D warnings && cargo clippy --test languages --test linker --all-features -- -D warnings && cargo test --package acdd-index --lib && cargo test --test languages --test linker {test_filter}"
      "crates/acdd-index/src/linker/**": "cargo clippy --package acdd-index --lib --all-features -- -D warnings && cargo clippy --test languages --test linker --all-features -- -D warnings && cargo test --package acdd-index --lib && cargo test --test languages --test linker {test_filter}"
      "**": "cargo clippy {scope_target} --all-features -- -D warnings && cargo test {scope_target} {test_filter}"
    post_command: "cargo test --test commitment_integrity"
    test_filter: "{test}"
    description: "Run strict Rust checks, the scoped test suite (including cross-package languages/linker suites), and commitment_integrity boundary fences."

  build_check: *build_check_cmd

  polish_check:
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo run -q -- docs check && cargo run -q -- validate && ./website/build.sh --check"
    description: "Run fast compilation, strict Clippy, commitment_integrity, docs/spec validation, and website sync/build check on polish before run_tests runs full Linux + macOS suites."
    timeout_seconds: 600

  check_full_repo: &verify_all_cmd
    command: "./scripts/check-full-repo.sh"
    description: "Run fast sequential pre-checks, then Linux workspace tests and macOS SSH verification in parallel."
    timeout_seconds: 1800

  verify_all: *verify_all_cmd

scope_args_by_pattern:
  "src/main.rs": "--bin acdd"
  "src/**/*.rs": "--lib"
  "crates/acdd-core/**/*.rs": "--package acdd-core --lib"
  "crates/acdd-spec/**/*.rs": "--package acdd-spec --lib"
  "crates/acdd-index/**/*.rs": "--package acdd-index --lib"
  "crates/acdd-state/**/*.rs": "--package acdd-state --lib"
  "crates/acdd-state/tests/**/*.rs": "--package acdd-state --test state_integration"
  "tests/*.rs": "--test {file_stem}"
  "tests/acdd/**/*.rs": "--test acdd"
  "tests/common/**/*.rs": "--all-targets"
  "tests/commitment_integrity/**/*.rs": "--test commitment_integrity"
  "tests/core/**/*.rs": "--test core"
  "tests/framework_manifests/**/*.rs": "--test languages"
  "tests/incremental/**/*.rs": "--test core"
  "tests/languages/**/*.rs": "--test languages"
  "tests/linker/**/*.rs": "--test linker"
  "tests/mcp/**/*.rs": "--test mcp"
  "tests/mcp_context/**/*.rs": "--test mcp"
  "tests/query_context/**/*.rs": "--test query_context"
  "tests/receivers/**/*.rs": "--test linker"

roles:
  architect:
    models:
      - gemini-4-neon-xhigh
      - gemini-4-hydrogen-xhigh
  builder:
    models:
      - gemini-4-neon-low
      - gemini-4-neon-medium
  independent_reviewer:
    models:
      - gemini-4-neon-xhigh
      - gemini-4-neon-high
  integration_reviewer:
    mode: subagent
    models:
      - gemini-4-neon-xhigh
      - gpt-6.2-sol
  coordinator:
    mode: inline
    reuse_on_reject: true
    guidance: "Execute inline as the main coordinator agent: write a strict `retrospectives` Spec (`.acdd/specs/retrospective.yaml`: `gate_stats`, `problems`, `tool_usage`, optional `blueprint_quality`/`code_quality`) to primary repo `<primary_root>/docs/memories/.retro/<workflow>/<spec_or_run>.md` (NOT temporary `.worktrees/<run>/`) before submitting handoff."

guidance:
  repo.rust:
    description: "RUST HOT-PATH & CODEC STANDARDS"
    criteria:
      - "Use closed `enum`s, validated newtypes, `From`/`TryFrom`, `&dyn Trait`, and non-generic inner fns (no mirror `Mcp*` structs or magic strings)."
      - "Borrow `&str`/`&Path`/`Cow<'_, str>` and intern repeated symbols (`Arc<str>`, `CompactTag`); hash via `acdd_core::format::sha256_serde_json` and bind codecs with `struct_codecs!`."
      - "Batch Git/SQLite/spec reads (`git cat-file --batch`, single `ls-tree`, preloaded `BTreeMap`); prove `Ok(None) => slow_path` non-fallbacks and benchmark hot paths on `--release`."
      - "Run `code_map_impact`/`ast_grep_search` across `archive`/`sync`/`restore`/examples/docs before editing; reuse adjacent owners/DTO fields; split >600-800 LOC modules; guard UTF-8 `is_char_boundary` and empty scopes."
      - "Never add language-name checks in universal `linker/` or `db/lint/` or write parallel walkers/parsers/lexers: extend the canonical upstream owner or escalate."
      - "Route all Spec consumers through one `acdd-spec` resolver and cover all 3 precedence cases (path-inferred, matching `spec:`, cross-dir `spec:` override)."
      - "Before submitting `tasks.build`, run `acdd context <node_cursor>` (and `code_map_analyze(mode=\"diff\")`) to re-check `specs.memories` against the live diff."
  repo.tests:
    description: "REPOSITORY TEST BUDGETS"
    criteria:
      - "NEVER run unfiltered `cargo test` / `--workspace` manually during `build`/`review`/`polish`; run scoped `cargo test {scope_target} <filter>` and `acdd verify`."
      - "Keep `RunHarness::in_memory()`/unit tests `< 5 ms`, focused integration tests `< 1 s`, `tests/acdd < 15 s` (`tests/AGENTS.md`, `docs/architecture/test-harness.md`)."
      - "Do not add FS/`temp_dir`/`Workspace` tests in `crates/**/src/**` `#[cfg(test)]`: add matrix rows in canonical `tests/<domain>.rs` binaries."
      - "Set `commit.gpgsign=false` in fixture Git setups and verify zero `/tmp/contextunity-test-*` leaks (`BEFORE == AFTER`)."
  repo.memory_synthesis:
    description: "PRE-HANDOFF RETROSPECTIVE SPEC SYNTHESIS"
    criteria:
      - "Before submitting `handoff`, analyze the live run via `acdd_state(action: \"show\")` (or `acdd show <run>`), `.acdd/state.sqlite` read-only data (`runs`, `gate_nodes`, `gate_claims`, `gate_traces`, `gate_artifacts`, `blackboard`), and `git log --stat <target_base_commit>..HEAD`."
      - "Write a strict `retrospectives` Spec (`.acdd/specs/retrospective.yaml`) into primary repository `<primary_root>/docs/memories/.retro/<workflow>/<spec_id_or_run_name>.md` (NOT inside the temporary `.worktrees/<run>/` checkout deleted on landing; `/docs/memories/.retro/` is gitignored so `claim_tree` stays untouched): frontmatter `id`, `title`, `spec: retrospectives`, `status: active`, `workflow`, `run_id`, `outcome`, optional `blueprint_quality` and `code_quality`."
      - "Populate structured items with zero free-form bloat: `### gate_stat: <ref>` (`gate`, `attempts`, `rejections`, `cycles`, optional `top_reasons`), `### problem: <ref>` (`domain`, `stage`, `count`, `summary`, optional `root_cause`), and `### tool_usage: <ref>` (`tool`, `pattern`, `issue`, optional `instruction_gap`)."

gates_patch:
  - id: blueprint_synthesis.synthesize
    context:
      - paths.instructions
      - paths.adrs
      - docs.invariants
      - specs.memories
  - id: tasks.build
    checks:
      - check: code.lint
        with:
          categories:
            - arch
            - syntax
            - docs
            - duplicates
            - dead_tails
            - cycles
    guidance: [task.code, core.execution, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
    context:
      - paths.instructions
      - paths.adrs
      - docs.invariants
      - specs.memories
      - code.symbols
      - code.tests
      - code.external_callers
  - id: tasks.review
    guidance: [task.review, core.review, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
    context:
      - paths.instructions
      - paths.adrs
      - docs.invariants
      - specs.memories
      - code.symbols
      - code.tests
      - code.external_callers
  - id: tasks.rearchitect
    guidance: [task.rearchitect, core.execution, code.principles, code.tools, repo.rust, hitl.pro]
  - id: run_tests
    command: check_full_repo
    checks:
      - check: code.lint
        with:
          categories:
            - arch
            - syntax
            - docs
            - duplicates
            - dead_tails
            - cycles
  - id: integration_review
    role: integration_reviewer
    guidance: [milestone.review, core.review, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
    context:
      - paths.instructions
      - paths.adrs
      - docs.invariants
      - specs.memories
      - code.symbols
      - code.tests
      - code.external_callers
  - id: polish
    scope:
      - ".acdd/workflows/**"
      - ".acdd/specs/**"
      - ".acdd/lint/**"
      - "paths.docs"
      - "paths.adrs"
      - "paths.instructions"
      - "website/**"
      - "skills/**"
      - "ROADMAP.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - ".gitignore"
    command: polish_check
    checks:
      - check: docs.specs
    guidance: [milestone.polish, core.execution, code.principles, code.tools, repo.rust, repo.tests, hitl.pro]
    context:
      - paths.instructions
      - paths.adrs
      - docs.invariants
      - specs.memories
  - id: handoff
    role: coordinator
    guidance: [milestone.handoff, repo.memory_synthesis, core.execution, hitl.pro]

