# =============================================================================
# STANDALONE WORKFLOW EXAMPLE: Code Quality & Polish Loop
#
# ADR 0003 Unified Profile Engine: Pure gate graph without tasks.
# Run via: `acdd run --profile docs/workflows/code-quality-and-polish.workflow.yaml`
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual

save: none

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=medium -'
    prompt_template: 'Perform {node_cursor} in {worktree} (run {run_id}). Guidance: {guidance}. Return a structured decision and proof.'
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=xhigh -'
    prompt_template: 'Perform {node_cursor} in {worktree} (run {run_id}). Guidance: {guidance}. Return a structured decision and proof.'
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    timeout_seconds: 600

# Pure gate sequence with cyclic repair:
gates:
  - id: verify
    command: check_full_repo
    proof: command
    fail: polish

  - id: polish
    role: builder
    command: check_full_repo
    max_attempts: 3
    proof: &decision_proof
      scheme:
        type: object
        required: [decision, summary]
        properties:
          decision: {type: string, enum: [pass, reject]}
          summary: {type: string}
    pass: review

  - id: review
    role: independent_reviewer
    independent_from:
      - polish
    need:
      - polish
    max_attempts: 3
    proof: *decision_proof
    fail: polish
