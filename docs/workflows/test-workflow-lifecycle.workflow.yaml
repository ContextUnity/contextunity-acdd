# =============================================================================
# TEST WORKFLOW: Pure Workflow Model E2E Verification
# Purpose: Autonomous verification of Model 1 (pure gate graph without tasks).
# Invariants:
#   1. save: none (ephemeral observations)
#   2. Zero task table rows, zero task claims.
#   3. Forward/cyclic rejection routing: verify (fail: polish) -> polish -> review.
# =============================================================================

version: 2
inherit: none

save: none

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -C "{worktree}" -m "{model}" -c model_reasoning_effort="{reasoning}" "{prompt}"'
    prompt_template: 'Perform {stage} as {role} in {worktree}. Goal: {goal}. {role_guidance} Return a structured decision and proof.'
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -C "{worktree}" -m "{model}" -c model_reasoning_effort="{reasoning}" "{prompt}"'
    prompt_template: 'Perform {stage} as {role} in {worktree}. Goal: {goal}. {role_guidance} Return a structured decision and proof.'
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-targets"
    timeout_seconds: 600

policies:
  default_review:
    independent_worker: true
    require_all_contours: true

gates:
  - id: verify
    command: check_full_repo
    fail: polish

  - id: polish
    role: builder
    command: check_full_repo
    max_attempts: 3
    proof: &decision_proof
      scheme:
        type: object
        required: [decision, summary]
        properties:
          decision: {type: string, enum: [pass, reject]}
          summary: {type: string}
    pass: review

  - id: review
    role: independent_reviewer
    policy: default_review
    independent_from: polish
    max_attempts: 3
    proof: *decision_proof
    fail: polish
