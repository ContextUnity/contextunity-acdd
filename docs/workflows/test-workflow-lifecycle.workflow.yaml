# =============================================================================
# TEST WORKFLOW: Pure Workflow Model E2E Verification
# Purpose: Autonomous verification of pure gate graph without tasks.
# Invariants:
#   1. save: none (ephemeral observations)
#   2. Zero task rows, zero task claims.
#   3. Forward/cyclic rejection routing: verify (fail: polish) -> polish -> review.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: manual
  integrate: manual

save: none

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=medium -'
    prompt_template: 'Perform {node_cursor} in {worktree} (run {run_id}). Guidance: {guidance}. Return a structured decision and proof.'
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=xhigh -'
    prompt_template: 'Perform {node_cursor} in {worktree} (run {run_id}). Guidance: {guidance}. Return a structured decision and proof.'
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  check_full_repo:
    command: "cargo test --test commitment_integrity && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo test --workspace --lib"
    output:
      counts:
        passed: '(?m)\b(\d+) passed\b'
        failed: '(?m)\b(\d+) failed\b'
      require_counts: true
    timeout_seconds: 600

gates:
  - id: verify
    command: check_full_repo
    proof: command
    fail: polish

  - id: polish
    role: builder
    command: check_full_repo
    max_attempts: 3
    proof: &decision_proof
      scheme:
        type: object
        required: [decision, summary]
        properties:
          decision: {type: string, enum: [pass, reject]}
          summary: {type: string}
    pass: review

  - id: review
    role: independent_reviewer
    independent_from:
      - polish
    need:
      - polish
    max_attempts: 3
    proof: *decision_proof
    fail: polish
