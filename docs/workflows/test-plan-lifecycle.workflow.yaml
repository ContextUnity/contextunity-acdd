# =============================================================================
# TEST WORKFLOW: Plan Model In-Place Execution & Archive E2E Verification
# Purpose: Autonomous verification of in-place plan execution (tasks container without root milestone gates).
# Invariants:
#   1. git.isolation: in_place + save: none (verifies scoped TreeOid state without auto-commits)
#   2. In-place execution on current branch without worktree spawning.
#   3. Zero root milestone gates (no blueprint_synthesis pre-task container, no handoff closure).
#   4. Completion updates state and durable receipts cleanly without touching protected main.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual

save: none

roles:
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt-6.1-sol:medium'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    models:
      - 'gpt-6.1-sol:xhigh'

contours:
  paths:
    description: "Verify changes stay within admitted write scope."
    criteria:
      - "Compare modified files against task scope."
  claims:
    description: "Verify every accepted claim is supported by fresh trace evidence."
    criteria:
      - "Confirm build verification passed cleanly."

commands:
  rust-check-and-test:
    command: "cargo clippy --all-targets --all-features -- -D warnings && cargo test {test_filter}"
    test_filter: "{test}"
    timeout_seconds: 180

# Plan model topology: strictly the tasks: container
gates:
  - tasks:
      gates:
        - id: build
          role: builder
          command: rust-check-and-test
          proof: command
          save:
            post: none
          pass: review

        - id: review
          role: independent_reviewer
          proof: review
          contours:
            - paths
            - claims
          independent_from:
            - build
          need:
            - build
          pass: deliver
          fail: build
          save:
            immutable: true

        - id: deliver
          role: independent_reviewer
          receipt: true
          need:
            - build
            - review
          independent_from:
            - build
          fail: build
          save:
            immutable: true
            post: none
