# =============================================================================
# STANDALONE WORKFLOW: Implementation Plan Authoring & Validation
#
# ADR 0003 Unified Profile Engine: Standalone root-gate workflow (inherit: none, save: none).
# Role architect synthesizes a structured markdown plan in docs/plans/<slug>.md
# with valid targets, write scopes, and acyclic depends_on dependencies.
# Role independent_reviewer audits step granularity, in-place safety, and scope validity.
# Gate preflight validates the plan document via `acdd validate`.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: manual
  integrate: manual

save: none

roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=high -'
    prompt_template: >-
      Execute architect for run {run_id}, gate {node_cursor}, in {worktree}.
      Contract: {contract}. Guidance: {guidance}.
    guidance: "Author an actionable implementation plan in docs/plans/<slug>.md with valid frontmatter, ### task: <ref> YAML sections, valid target, scope, status: planned, and acyclic depends_on references."
    models:
      - 'gpt-6.1-sol:high'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=xhigh -'
    prompt_template: >-
      Execute independent_reviewer for run {run_id}, gate {node_cursor}, in {worktree}.
      Contract: {contract}. Guidance: {guidance}.
    guidance: "Audit the authored implementation plan for task granularity, acyclic dependency topology, in-place snapshot safety, and valid write scopes."
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  validate_plan:
    command: "acdd validate {scope_target}"
    timeout_seconds: 60
    output:
      require_counts: false

gates:
  - id: synthesize
    role: architect
    max_attempts: 3
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_overview
      - code_map_search
      - ast_grep_search
      - acdd_read
      - get_doc
      - search_docs
      - acdd_blackboard
    proof:
      scheme:
        type: object
        required:
          - plan_slug
          - plan_path
          - step_count
          - dependency_dag
          - scopes_valid
        properties:
          plan_slug:
            type: string
          plan_path:
            type: string
          step_count:
            type: integer
          dependency_dag:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          scopes_valid:
            type: boolean
    pass: review

  - id: review
    role: independent_reviewer
    max_attempts: 3
    independent_from:
      - synthesize
    need:
      - synthesize
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_search
      - ast_grep_search
      - acdd_read
      - get_doc
      - search_docs
      - acdd_blackboard
    proof:
      scheme:
        type: object
        required:
          - decision
          - summary
          - step_findings
        properties:
          decision:
            type: string
            enum: ["pass", "reject"]
          summary:
            type: string
          step_findings:
            type: array
            items:
              type: string
    pass: preflight
    fail: synthesize

  - id: preflight
    command: validate_plan
    proof: command
