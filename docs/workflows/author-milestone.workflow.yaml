# =============================================================================
# STANDALONE WORKFLOW: Milestone Authoring & Validation
#
# ADR 0003 Unified Profile Engine: Standalone root-gate workflow (inherit: none, save: none).
# Role architect synthesizes a structured spec manifest with acyclic tasks,
# disjoint scopes, grounded symbols, and Clean Architecture layer boundaries.
# Role independent_reviewer audits the draft for invariants and scope disjointness.
# Gate preflight validates the spec manifest via `acdd validate`.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: manual
  integrate: manual

save: none

roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=high -'
    prompt_template: >-
      Execute architect for run {run_id}, gate {node_cursor}, in {worktree}.
      Contract: {contract}. Guidance: {guidance}.
    guidance: "Read docs/milestones/README.md and docs/milestones/AGENTS.md first, inspect docs/milestones/ and docs/milestones/archive/, choose the matching domain prefix (AC, LS, PF, AR, UX, IN) and next unused sequential 3-digit number <TAG>-<NNN>-<slug>, and synthesize an actionable spec manifest in docs/milestones/<id>.md. Ground symbols with code_map_inspect and invariants with search_docs. Partition tasks into acyclic waves with disjoint same-wave scopes. Forbid protected files (Cargo.toml, .acdd/**) unless explicitly authorized."
    models:
      - 'gpt-6.1-sol:high'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=xhigh -'
    prompt_template: >-
      Execute independent_reviewer for run {run_id}, gate {node_cursor}, in {worktree}.
      Contract: {contract}. Guidance: {guidance}.
    guidance: "Audit the authored milestone manifest against docs/milestones/README.md and docs/milestones/AGENTS.md for domain taxonomy fit, non-colliding sequential <TAG>-<NNN> numbering across docs/milestones/ and docs/milestones/archive/, acyclic waves, disjoint write scopes, layer isolation, negative boundaries, and authentic symbol citations."
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  validate_milestone:
    command: "acdd validate {scope_target}"
    timeout_seconds: 60
    output:
      require_counts: false

gates:
  - id: synthesize
    role: architect
    max_attempts: 3
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_overview
      - code_map_search
      - ast_grep_search
      - acdd_read
      - get_doc
      - search_docs
      - acdd_blackboard
    proof:
      scheme:
        type: object
        required:
          - milestone_id
          - manifest_path
          - wave_dag
          - scopes_disjoint
          - protected_files_excluded
        properties:
          milestone_id:
            type: string
          manifest_path:
            type: string
          wave_dag:
            type: array
            items:
              type: array
              items:
                type: string
          scopes_disjoint:
            type: boolean
          protected_files_excluded:
            type: boolean
    pass: review

  - id: review
    role: independent_reviewer
    max_attempts: 3
    independent_from:
      - synthesize
    need:
      - synthesize
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_search
      - ast_grep_search
      - acdd_read
      - get_doc
      - search_docs
      - acdd_blackboard
    proof:
      scheme:
        type: object
        required:
          - decision
          - summary
          - scope_findings
        properties:
          decision:
            type: string
            enum: ["pass", "reject"]
          summary:
            type: string
          scope_findings:
            type: array
            items:
              type: string
    pass: preflight
    fail: synthesize

  - id: preflight
    command: validate_milestone
    proof: command
