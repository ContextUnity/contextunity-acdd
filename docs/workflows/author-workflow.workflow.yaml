# =============================================================================
# STANDALONE WORKFLOW: Root-Gate Workflow Authoring & Validation
#
# ADR 0003 Unified Profile Engine: Standalone root-gate workflow (inherit: none, save: none).
# Role architect synthesizes a standalone root-gate workflow in docs/workflows/<name>.workflow.yaml
# with inherit: none, save: none, no tasks: container, no receipt: true, and valid
# pass:, fail:, and independent_from transitions.
# Role independent_reviewer audits gate graph transitions, role separation, and inline proof schemas.
# Gate preflight validates the workflow document via `acdd validate`.
# =============================================================================

version: 2
inherit: none

git:
  isolation: in_place
  worktrees: manual
  commit_mode: manual
  integrate: manual

save: none

roles:
  architect:
    mode: subagent
    reuse_on_reject: true
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=high -'
    prompt_template: >-
      Execute architect for run {run_id}, gate {node_cursor}, in {worktree}.
      Contract: {contract}. Guidance: {guidance}.
    guidance: "Author a standalone root-gate workflow in docs/workflows/<name>.workflow.yaml with version: 2, inherit: none, save: none, pure gate graph without tasks, no receipts, and valid pass/fail/independent_from transitions."
    models:
      - 'gpt-6.1-sol:high'

  independent_reviewer:
    mode: subagent
    reuse_on_reject: false
    runner: 'codex exec -m gpt-6.1-sol -c model_reasoning_effort=xhigh -'
    prompt_template: >-
      Execute independent_reviewer for run {run_id}, gate {node_cursor}, in {worktree}.
      Contract: {contract}. Guidance: {guidance}.
    guidance: "Audit the authored workflow profile for pure gate graph topology, absence of tasks container, role independence, and valid inline proof schemas."
    models:
      - 'gpt-6.1-sol:xhigh'

commands:
  validate_workflow:
    command: "acdd validate {scope_target}"
    timeout_seconds: 60
    output:
      require_counts: false

gates:
  - id: synthesize
    role: architect
    max_attempts: 3
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_overview
      - code_map_search
      - ast_grep_search
      - acdd_read
      - get_doc
      - search_docs
      - acdd_blackboard
    proof:
      scheme:
        type: object
        required:
          - workflow_name
          - workflow_path
          - gate_count
          - transitions_valid
          - taskless
        properties:
          workflow_name:
            type: string
          workflow_path:
            type: string
          gate_count:
            type: integer
          transitions_valid:
            type: boolean
          taskless:
            type: boolean
    pass: review

  - id: review
    role: independent_reviewer
    max_attempts: 3
    independent_from:
      - synthesize
    need:
      - synthesize
    tools:
      - code_map_inspect
      - code_map_impact
      - code_map_search
      - ast_grep_search
      - acdd_read
      - get_doc
      - search_docs
      - acdd_blackboard
    proof:
      scheme:
        type: object
        required:
          - decision
          - summary
          - structural_findings
        properties:
          decision:
            type: string
            enum: ["pass", "reject"]
          summary:
            type: string
          structural_findings:
            type: array
            items:
              type: string
    pass: preflight
    fail: synthesize

  - id: preflight
    command: validate_workflow
    proof: command
