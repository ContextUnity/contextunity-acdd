DEBUG: true
roots:
  - src
  - crates
  - tests
docs:
  - README.md
  - INSTALL.md
  - TESTS.md
  - ROADMAP.md
  - docs/AGENTS.md
  - docs/README.md
  - docs/adr
  - docs/architecture
  - docs/memories
  - docs/milestones
  - docs/plans
  - docs/reference
  - docs/runbooks
specs_dirs:
  - .acdd/specs
specs:
  milestones:
    path: docs/milestones
    prefixes:
      - AC
      - AR
      - PF
      - LS
      - UX
    digits: 3
  plans:
    path: docs/plans
    prefixes: []
    digits: 3
  memories:
    path: docs/memories
    base: memory
    roadmap: false
  retrospectives:
    path: docs/memories/.retro
    ref: retrospective
    roadmap: false
preset: full
workflows_dirs:
  - .acdd/workflows
lint_dirs:
  - .acdd/lint
state_db: .acdd/state.sqlite
retain_traces: 20
modules:
  code: true
  docs: true
  state: true
  blackboard: true
ignore:
  - target
  - vendor
  - .git
  - .acdd
  - website
limits:
  max_metadata_bytes: 2048
response:
  detail: compact
  page_size: 12
  max_output_bytes: 98304
  source_context:
    enabled_by_default: false
    leading_lines: 5
    max_body_lines: 35
