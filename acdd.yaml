DEBUG: true
roots:
  - src
  - crates
docs:
  - README.md
  - INSTALL.md
  - TESTS.md
  - ROADMAP.md
  - docs/AGENTS.md
  - docs/README.md
  - docs/adr
  - docs/architecture
  - docs/milestones
  - docs/plans
  - docs/workflows
  - docs/reference
  - docs/runbooks
specs:
  milestones:
    path: docs/milestones
    prefixes:
      - AC
    digits: 3
  plans:
    path: docs/plans
    prefixes:
      - PLAN
    digits: 3
profiles_dirs:
  - .acdd/profiles
  - docs/workflows
state_db: .acdd/state.sqlite
retain_traces: 20
modules:
  code: true
  docs: true
  state: true
  blackboard: true
ignore:
  - target
  - vendor
  - .git
  - .acdd
limits:
  max_metadata_bytes: 2048
response:
  detail: compact
  page_size: 30
  max_output_bytes: 98304
  source_context:
    enabled_by_default: false
    leading_lines: 5
    max_body_lines: 35
